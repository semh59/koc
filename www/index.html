<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef2f0">
<title>NeoWell</title>
<link rel="icon" href="logo.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root{
  --bg:#eef2f0; --card:#ffffff; --ink:#10232b; --mut:#62737a; --line:#d9e2de;
  --prim:#0f5c55; --prim-ink:#ffffff; --soft:#e1ece8;
  --su:#2a86bd; --kcal:#d9822b; --spor:#7d56c8; --warn:#c2452d;
  --r:18px; --r-s:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1618; --card:#16222a; --ink:#e8f0ee; --mut:#8ea0a6; --line:#25353d;
    --prim:#4fc2a8; --prim-ink:#06211c; --soft:#1b2d33;
    --su:#5bb4ea; --kcal:#f0a24f; --spor:#a98cec; --warn:#ef7a62;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 0;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--prim);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{padding:18px 20px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
header .streak{font-size:14px;color:var(--mut);white-space:nowrap}
header .streak b{color:var(--ink)}
main{flex:1;padding:6px 16px calc(92px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* Kilo kartı: tek vurgu */
.weight{background:var(--prim);color:var(--prim-ink);border-radius:26px;padding:20px 20px 16px;margin-bottom:12px}
.weight .cap{font-size:14px;opacity:.82}
.weight .big{display:flex;align-items:baseline;gap:8px;margin:2px 0 4px}
.weight .big .v{font-size:76px;line-height:1;font-weight:800;letter-spacing:-.04em}
.weight .big .u{font-size:22px;font-weight:600;opacity:.8}
.weight .row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;opacity:.92}
.weight svg{display:block;width:100%;height:44px;margin-top:10px}
.weight .empty{font-size:17px;margin:6px 0 2px;line-height:1.35}
.weight .wbtn{margin-top:12px;background:var(--prim-ink);color:var(--prim);border-radius:999px;padding:10px 18px;font-weight:700}

.coach{margin:2px 4px 14px;color:var(--mut);font-size:15px}

.card{background:var(--card);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:12px;border:1px solid var(--line)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.ring{position:relative}
.ring svg{width:88px;height:88px;display:block;margin:0 auto}
.ring .rt{fill:none;stroke:var(--soft);stroke-width:8}
.about{display:flex;flex-direction:column;align-items:center;gap:4px;margin:24px 0 8px;font-size:17px}
.about img{border-radius:50%}
.ring .rp{fill:none;stroke-width:8;stroke-linecap:round}
.ring .rc{position:absolute;left:0;right:0;top:30px;font-weight:700;font-size:15px}
.ring .rl{font-weight:600;font-size:14px;margin-top:2px}
.ring .rs{font-size:12.5px;color:var(--mut)}

.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;min-height:68px;transition:transform .08s}
.act:active{transform:scale(.95)}
.act .ic{font-size:24px;line-height:1.1}
.act.su{border-color:color-mix(in srgb,var(--su) 55%,var(--line))}

h2{font-size:15px;margin:18px 4px 8px;font-weight:700}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .t{color:var(--mut);font-size:13px;width:42px;flex:none}
.log .ic{width:22px;text-align:center;flex:none}
.log .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.log .vl{color:var(--mut);font-size:14px;white-space:nowrap}
.log .del{width:44px;height:44px;margin:-6px -6px -6px 0;border-radius:50%;color:var(--mut);font-size:18px;flex:none}
.dnav{display:flex;align-items:center;justify-content:space-between}
.dnav h2{flex:1;text-align:center;margin:10px 4px 4px}
.dnav button{width:44px;height:44px;border-radius:50%;font-size:24px;color:var(--mut)}
.dnav button:disabled{opacity:.3;cursor:default}
.log .del:active{background:var(--soft)}
.hint{color:var(--mut);font-size:14px;padding:6px 4px 2px}

/* Trend */
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;margin:2px 0 10px}
.seg button{padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:10.5px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:6px}
.stat .k{font-size:13px;color:var(--mut)}
.stat .v{font-size:20px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--mut);text-align:right;padding:4px 4px 8px;font-size:13px}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
td.today,th.today{font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--spor);border-radius:99px}

/* Koç */
#composer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:6;background:var(--bg);padding:6px 12px 8px;max-width:520px;margin:0 auto}
#composer[hidden]{display:none}
.chiprow{display:flex;gap:6px;margin-bottom:6px;overflow:hidden}.chiprow .chip{flex:1 1 auto;min-height:44px;padding:0 8px;font-size:13.5px;border:1px solid var(--mut);background:var(--card)}
.cin{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--mut);border-radius:26px;padding:0 4px 0 16px;height:50px}
.cin input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
#csend{width:44px;height:44px;border-radius:50%;background:var(--prim);color:var(--prim-ink);font-size:18px}
body.koc main{padding-bottom:calc(200px + env(safe-area-inset-bottom))}
body.koc #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
.chat{display:flex;flex-direction:column;gap:12px}
.ub{align-self:flex-end;max-width:84%;background:color-mix(in srgb,var(--prim) 22%,var(--card));border-radius:18px 18px 4px 18px;padding:10px 14px;overflow-wrap:anywhere;white-space:pre-wrap}
.pendl{align-self:flex-end;margin-top:-8px;font-size:13px;color:var(--mut)}
.cm{padding:0 4px}.cm p{margin:0;font-size:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.dots{letter-spacing:3px;color:var(--mut)}
.banner{background:#fbeede;border:1px solid #ecd0a8;color:#4d2f07;border-radius:16px;padding:14px;margin-bottom:12px}
.banner.info{background:#e6f0f6;border-color:#b9d3e3;color:#14425e}
.banner p{margin:2px 0 10px;font-size:14.5px;line-height:1.45}.banner .btn{width:auto;padding:11px 18px}
.scard{background:#e6f0f6;border:1px solid #b9d3e3;color:#10232b;border-radius:16px;padding:14px;margin-top:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scard{background:#16303d;border-color:#2a4b5d;color:#e8f0ee}:root:not([data-theme="light"]) .banner{background:#3a2a14;border-color:#5b4322;color:#f3dcb8}:root:not([data-theme="light"]) .banner.info{background:#16303d;border-color:#2a4b5d;color:#d5e8f3}}
.scard b{font-size:17px}.scard p{margin:6px 0 10px;font-size:15px;line-height:1.5}
.srow2{display:flex;gap:8px;margin-bottom:8px}.sbtn{flex:1;min-height:46px;border-radius:12px;background:#1f5f86;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none}
.sbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.lcard{margin:8px 0 0}.lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tahmin{font-size:12px;font-weight:600;color:#6b3f08;background:#fbe9d2;border-radius:99px;padding:3px 10px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.kin{width:64px;height:40px;text-align:right;border:1px solid var(--mut);border-radius:8px;background:var(--bg);padding:0 6px}
.lbtns{display:flex;gap:8px;margin-top:10px}.lbtns .btn{padding:12px}
.chkrow{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}.chkrow input{width:22px;height:22px}
/* Salon */
.mut{color:var(--mut)}.sm{font-size:13px;display:block}
.trow{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px}
.tmain{flex:1;text-align:left;display:grid;gap:1px;min-height:44px;padding:4px 0}
.tmain .mut{font-size:13px}
.rrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;min-height:44px}
.rrow:last-child{border-bottom:0}.rrow .tx{flex:1}
.gbar{display:grid;grid-template-columns:56px 1fr 24px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.gbar .bar{margin:0}
.livebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 4px 10px}
.livebar b{font-size:18px}.fin{width:auto;padding:11px 20px}
.rest{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--spor) 14%,var(--card));border:1px solid color-mix(in srgb,var(--spor) 35%,var(--line));border-radius:16px;padding:8px 10px;margin-bottom:10px}
.rest[hidden]{display:none}.rest>div{flex:1;display:grid}.rest b{font-size:26px;line-height:1.1}
.rest button{min-width:44px;height:44px;border-radius:10px;background:var(--card);font-weight:700;font-size:14px;padding:0 10px}
.ex{padding:8px 10px 6px}.exh{display:flex;align-items:center}
.exn{flex:1;text-align:left;display:grid;min-height:44px;align-content:center}.exn b{font-size:17px}.exn .mut{font-size:13px}
.sug{font-size:13px;color:var(--spor);margin:0 4px 6px}.note{font-size:13px;color:var(--mut);margin:0 4px 6px;font-style:italic}
.shead,.srow{display:grid;grid-template-columns:28px 1fr 70px 70px 44px;gap:8px;align-items:center}
.shead{font-size:12.5px;color:var(--mut);padding:0 4px 4px;text-align:center}.shead span:nth-child(2){text-align:left}
.srow{padding:3px 4px;border-radius:12px;margin-bottom:4px}.srow.dn{background:color-mix(in srgb,var(--spor) 12%,var(--card))}
.sn{text-align:center;font-weight:700;color:var(--mut)}.sp{font-size:14px;color:var(--mut)}
.sin{height:44px;width:100%;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;padding:0}
.ok{width:44px;height:44px;border-radius:12px;border:2px solid var(--mut);color:var(--mut);display:flex;align-items:center;justify-content:center}
.ok.on{background:var(--spor);border-color:var(--spor);color:#fff}
.lnk{display:block;width:100%;min-height:44px;color:var(--prim);font-weight:700;font-size:14px}.lnk.dng{color:var(--warn);margin-top:6px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;padding:6px 4px;border-top:1px solid var(--line);text-align:left}
.prow.dng{color:var(--warn)}.prow b{display:block}.plus{font-size:24px;color:var(--prim);width:44px;text-align:center}
.tag{font-size:13px;font-weight:600;background:color-mix(in srgb,var(--prim) 18%,var(--card));border-radius:99px;padding:3px 10px}
.plist{max-height:42vh;overflow:auto;margin-bottom:8px}
.sumv{font-size:56px;font-weight:800;letter-spacing:-.03em;color:var(--spor);line-height:1.1;margin:6px 0}.sumv small{font-size:18px;font-weight:600;color:var(--mut)}
.pr{background:color-mix(in srgb,var(--spor) 14%,var(--card));border-radius:14px;padding:10px 12px;margin-top:10px;display:grid;gap:6px}
.sparkbox svg{width:100%;height:44px;display:block;margin:8px 0}
.seg2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.seg2 button{min-height:44px;border:1px solid var(--mut);border-radius:12px;font-weight:600;font-size:14px}
.seg2 button[aria-pressed="true"]{background:var(--prim);color:var(--prim-ink);border-color:var(--prim)}
/* Ayarlar */
.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{flex:1}
.field small{display:block;color:var(--mut);font-size:13px}
.field input[type=text],.field input[type=time],.field input[type=number]{width:104px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.rem{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:0}
.rem .nm{flex:1;font-size:15px}
.rem input[type=time]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .15s;pointer-events:none}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--prim)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--prim);outline-offset:2px}
.btn{background:var(--prim);color:var(--prim-ink);border-radius:var(--r-s);padding:13px 18px;font-weight:700;width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
.btns{display:grid;gap:8px;margin-top:8px}
.status{font-size:14px;color:var(--mut);padding:2px 2px 8px}

/* Alt gezinme */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;font-size:12px;font-weight:600;color:var(--mut)}
nav button .ic{font-size:21px;line-height:1.2}
nav button[aria-current="page"]{color:var(--prim);background:var(--soft)}

/* Alt sayfa */
#scrim{position:fixed;inset:0;background:rgb(6 14 17/.5);opacity:0;pointer-events:none;transition:opacity .18s;z-index:10}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s .22s;max-width:520px;margin:0 auto;max-height:88vh;overflow:auto}
#sheet.on{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s}
#sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
#sheet h3{margin:0 0 12px;font-size:18px}
#sheet .in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:13px 14px;font-size:18px;margin-bottom:10px}
#sheet textarea.in{min-height:96px;resize:vertical;font-size:16px}
#sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{background:var(--soft);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--prim);color:var(--prim-ink)}
.lbl{font-size:13px;color:var(--mut);margin:2px 2px 6px}
select.in{appearance:none}

#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:20;transform:translateY(30px);opacity:0;pointer-events:none;transition:all .2s;font-size:15px}
#toast.on{transform:none;opacity:1;pointer-events:auto}
#toast span{flex:1}
#toast button{font-weight:700;color:var(--su);padding:4px 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="ttl">Bugün</h1><div class="streak" id="streak"></div></header>
  <main id="view"></main>
</div>
<nav aria-label="Ana menü"><div class="in">
  <button data-tab="koc"><span class="ic">💬</span>Koç</button>
  <button data-tab="bugun"><span class="ic">🏠</span>Bugün</button>
  <button data-tab="salon"><span class="ic">🏋️</span>Salon</button>
  <button data-tab="trend"><span class="ic">📈</span>Trend</button>
  <button data-tab="ayar"><span class="ic">⚙️</span>Ayarlar</button>
</div></nav>
<div id="composer" hidden>
  <div class="chiprow"><button class="chip" data-act="su">💧 +250</button><button class="chip" data-act="kilo">⚖️ Kilo</button><button class="chip" data-act="yemek">🍽 Yemek</button><button class="chip" data-tab="salon">🏃 Spor</button></div>
  <div class="cin"><input id="cmsg" aria-label="Koça yaz" placeholder="Koça yaz" autocomplete="off" maxlength="600"><button id="csend" data-c="send" aria-label="Gönder">➤</button></div>
</div>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"><span id="tmsg"></span><button id="tundo" hidden>Geri al</button></div>

<script src="algo.js"></script>
<script src="gym.js"></script>
<script src="backuplib.js"></script>
<script src="coachlib.js"></script>
<script src="coach.js"></script>
<script>
"use strict";
/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const dayKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(n,from=new Date())=>new Date(from.getFullYear(),from.getMonth(),from.getDate()+n);
const keyOff=n=>dayKey(addDays(n));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(x,d=1)=>Number(x).toFixed(d).replace(".",",");
const fmtS=(x,d=1)=>(x>0.049?"+":x<-0.049?"−":"")+fmt(Math.abs(x),d);
const num=(s,int)=>{
  const m=String(s==null?"":s).match(/\d[\d.,]*/);if(!m)return NaN;
  let t=m[0].replace(/[.,]+$/,"");
  const last=Math.max(t.lastIndexOf(","),t.lastIndexOf("."));
  if(last>=0){
    const tail=t.length-last-1,both=t.includes(",")&&t.includes("."),n=(t.match(/[.,]/g)||[]).length;
    const thousands=int?tail===3:(!both&&n>1);
    t=thousands?t.replace(/[.,]/g,""):t.slice(0,last).replace(/[.,]/g,"")+"."+t.slice(last+1);
  }
  const v=parseFloat(t);return isNaN(v)?NaN:(int?Math.round(v):v);
};

function cleanSettings(raw){

function cleanEntries(arr){
  const out=[];let drop=0;
  for(const e of arr){
    if(!e||typeof e!=="object"||!TYPES.includes(e.type)||!dayOk(e.day)){drop++;continue}
    const v=e.v==null?null:Number(e.v);
    const bad=(v!=null&&!isFinite(v))||
      (e.type==="kilo"&&!(v>=20&&v<=400))||(e.type==="su"&&!(v>0&&v<=10000))||
      (e.type==="spor"&&!(v>0&&v<=600))||(e.type==="yemek"&&v!=null&&!(v>=0&&v<=20000));
    if(bad){drop++;continue}
    const ne={id:0,day:e.day,time:timeOk(e.time)?e.time:"00:00",type:e.type,v:e.type==="not"?null:v,text:typeof e.text==="string"?e.text.slice(0,500):""};

function ring(p,color,center,label,sub){
  const r=34,c=2*Math.PI*r,f=Math.min(Math.max(p,0),1);
  return `<div class="ring"><svg viewBox="0 0 84 84" aria-hidden="true"><circle class="rt" cx="42" cy="42" r="${r}"/>${f>0?`<circle class="rp" cx="42" cy="42" r="${r}" stroke="${color}" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/>`:""}</svg><div class="rc num">${center}</div><div class="rl">${label}</div><div class="rs num">${sub}</div></div>`;
}
function spark(points){ // points: [{i,v}] i=0..n-1
  if(points.length<2)return "";
  const W=300,H=44,xs=points.map(p=>p.i),vs=points.map(p=>p.v);
  const x0=Math.min(...xs),x1=Math.max(...xs),lo=Math.min(...vs),hi=Math.max(...vs),sp=Math.max(hi-lo,0.6);
  const X=i=>4+(W-8)*((i-x0)/Math.max(x1-x0,1)),Y=v=>H-5-(H-10)*((v-lo)/sp);
  const d=points.map((p,k)=>(k?"L":"M")+X(p.i).toFixed(1)+" "+Y(p.v).toFixed(1)).join("");
  const last=points[points.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><circle cx="${X(last.i).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="3.6" fill="currentColor"/></svg>`;
}
function trendSeries(N){
  const keys=[];for(let i=N-1;i>=0;i--)keys.push(keyOff(-i));
  const w=weights(keys[0],keys[N-1]);
  const tr=Algo.trend(weights("0000",keys[N-1])); // aralıktan önceki geçmişle birlikte üstel ortalama
  const pts=[],ma=[];
  keys.forEach((k,i)=>{
    if(w[k]!=null){pts.push({i,v:w[k],k});ma.push({i,v:tr[k],k})}
  });
  return {keys,pts,ma};
}
function chart(N){
  const {keys,pts,ma}=trendSeries(N);
  if(pts.length<2)return `<p class="hint">Grafik için en az iki gün kilo gir.</p>`;
  const W=340,H=180,pl=36,pr=10,pt=10,pb=24;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  const g=S.settings.goalKg;
  if(g>0&&g>=lo-6&&g<=hi+6){lo=Math.min(lo,g);hi=Math.max(hi,g)}
  lo-=0.4;hi+=0.4;if(hi-lo<1.5){const m=(hi+lo)/2;lo=m-.75;hi=m+.75}
  const X=i=>pl+(W-pl-pr)*(N<=1?0:i/(N-1)),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let grid="";
  for(let t=0;t<=3;t++){const v=lo+(hi-lo)*t/3,y=Y(v);grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${fmt(v,1)}</text>`}
  const line=ma.map((p,k)=>(k?"L":"M")+X(p.i).toFixed(1)+" "+Y(p.v).toFixed(1)).join("");
  const dots=pts.map(p=>`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="var(--mut)" opacity=".55"/>`).join("");
  const goal=(g>0&&g>=lo&&g<=hi)?`<line x1="${pl}" x2="${W-pr}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" stroke="var(--kcal)" stroke-width="1.6" stroke-dasharray="5 4"/>`:"";
  const xl=[0,Math.floor((N-1)/2),N-1].map((i,k)=>`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${k==0?"start":k==2?"end":"middle"}">${dm(keys[i])}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo grafiği">${grid}${goal}${dots}<path d="${line}" fill="none" stroke="var(--prim)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${xl}</svg>
  <div class="legend"><span><i style="background:var(--prim)"></i>Trend çizgisi</span><span><i style="background:var(--mut);opacity:.6"></i>Günlük tartı</span>${goal?`<span><i style="background:var(--kcal)"></i>Hedef</span>`:""}</div>`;
}

    <p class="hint">Hamilelik, yeme bozukluğu geçmişi, hastalık ya da ilaç varsa buraya yaz. Öneriler bunlara göre ihtiyatlı olmalı, hekim kontrolü gerekebilir.</p></div>
  <h2>Hedefler</h2><div class="card">
    ${fld("goalKg","Hedef kilo (kg)",st.goalKg?String(st.goalKg).replace(".",","):"","Boş bırakırsan kapalı")}
    ${fld("kcal","Günlük kalori (kcal)",st.kcal||"","Boş bırakırsan kapalı","numeric")}
    ${fld("waterMl","Günlük su (ml)",st.waterMl,"","numeric")}
    ${fld("glass","Bir bardak (ml)",st.glass,"Su düğmesinin eklediği miktar","numeric")}
    ${fld("sportWeek","Haftalık spor (dk)",st.sportWeek,"","numeric")}
  </div>
  <h2>Hatırlatmalar</h2><div class="card"><div class="status">${esc(nf)}</div>
    ${st.reminders.map(r=>`<div class="rem"><span class="nm">${esc(r.name)}</span><input type="time" value="${r.t}" data-rt="${r.id}" aria-label="${esc(r.name)} saati"><label class="sw"><input type="checkbox" ${r.on?"checked":""} data-ro="${r.id}" aria-label="${esc(r.name)} açık"><span></span></label></div>`).join("")}
    <p class="hint">Koç bağlıysa sabah, öğleden sonra ve akşam bildirim metinlerini her gün yeniden yazar. Bağlı değilse sabit metinler kullanılır.</p></div>
  ${viewProviders()}
  <h2>Veriler</h2><div class="card"><div class="btns">
    <button class="btn ghost" data-act="yedek">Yedekle veya geri yükle</button>
    <button class="btn danger" data-act="sifirla">Tüm verileri sil</button></div>
    <p class="hint">Veriler yalnızca bu telefonda durur. Uygulamayı silersen kaybolur, o yüzden ara sıra yedek al.</p></div>
  <div class="about"><img src="logo.png" alt="NeoWell logosu" width="72" height="72"><b>NeoWell</b><span class="mut sm">Sağlığın yeni kaynağı</span></div>`;
}

function render(){
  const v=$("#view");
  const ttl={bugun:`${new Date().getDate()} ${AY[new Date().getMonth()]}, ${GUN[new Date().getDay()]}`,koc:"Koç",salon:"Salon",trend:"Trend",ayar:"Ayarlar"}[tab];
  $("#ttl").textContent=ttl;
  const n=streak();$("#streak").innerHTML=n>0?`<b class="num">${n}</b> günlük seri`:"";
  v.innerHTML=tab==="koc"?viewKoc():tab==="bugun"?viewBugun():tab==="salon"?viewSalon():tab==="trend"?viewTrend():viewAyar();
  document.body.classList.toggle("koc",tab==="koc");$("#composer").hidden=tab!=="koc";
  if(tab==="koc")cScroll();
  document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
}

/* ---------- alt sayfa ve bildirim ---------- */
function openSheet(html){$("#toast").classList.remove("on");const s=$("#sheet");s.innerHTML=`<div class="grab"></div>${html}`;s.classList.add("on");$("#scrim").classList.add("on");const f=s.querySelector("[autofocus]");if(f)setTimeout(()=>f.focus(),220)}
function closeSheet(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on")}
function toast(msg,undo){
  $("#tmsg").textContent=msg;lastUndo=undo==null?null:undo;$("#tundo").hidden=lastUndo==null;
  $("#toast").classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("#toast").classList.remove("on"),undo!=null?6000:3800);
}
function dayOptions(){
  let o="";for(let i=0;i<7;i++){const d=addDays(-i);o+=`<option value="${dayKey(d)}">${i==0?"Bugün":i==1?"Dün":GUN[d.getDay()]+" "+d.getDate()+" "+AY[d.getMonth()]}</option>`}
  return `<div class="lbl">Gün</div><select class="in" id="fday">${o}</select>`;
}
const fday=()=>($("#fday")||{}).value||dayKey();

function sheetKilo(){
  openSheet(`<h3>Kilo ekle</h3><input class="in num" id="fv" inputmode="decimal" placeholder="84,3" autocomplete="off" autofocus>${dayOptions()}<button class="btn" data-go="kilo">Kaydet</button>`);
}
function goKilo(){
  const v=num($("#fv").value);
  if(!(v>=20&&v<=400))return toast("Kiloyu kg olarak yaz, örneğin 84,3");
  const day=fday(),m=weights(),ds=Object.keys(m).filter(k=>k<day).sort(),prev=ds.length?m[ds[ds.length-1]]:null;
  const e=add("kilo",v,"",day);closeSheet();render();
  let msg=`${fmt(v)} kg kaydedildi`;
  if(prev!=null)msg+=`, öncekine göre ${fmtS(v-prev)} kg`;
  toast(msg,e.id);
}
function sheetYemek(){
  const cnt={};for(const e of S.entries)if(e.type==="yemek"&&e.text){const k=tr(e.text);(cnt[k]=cnt[k]||{n:0,text:e.text,v:e.v}).n++;cnt[k].v=e.v}
  const fav=Object.values(cnt).sort((a,b)=>b.n-a.n).slice(0,6);favList=fav;
  openSheet(`<h3>Yemek ekle</h3>${fav.length?`<div class="lbl">Sık yediklerin</div><div class="chips">${fav.map((f,i)=>`<button class="chip" data-fav="${i}">${esc(f.text)}${f.v?" "+Math.round(f.v):""}</button>`).join("")}</div>`:""}
  <input class="in" id="ft" placeholder="Ne yedin?" autocomplete="off" autofocus><input class="in num" id="fv" inputmode="numeric" placeholder="Kalori (isteğe bağlı)">${dayOptions()}<button class="btn" data-go="yemek">Kaydet</button>`);
}
function goYemek(){
  const text=$("#ft").value.trim(),kc=num($("#fv").value,true);
  if(!text&&isNaN(kc))return toast("Yemeğin adını ya da kalorisini yaz");
  if(!isNaN(kc)&&kc>20000)return toast("Kalori çok yüksek görünüyor, kontrol et");
  const e=add("yemek",isNaN(kc)?null:kc,text,fday());closeSheet();render();
  const t=dayKey(),top=sum("yemek",t,t),g=S.settings.kcal;
  toast(g>0&&top?`Kaydedildi. Bugün ${Math.round(top)} / ${g} kcal`:"Yemek kaydedildi",e.id);
}
const SPOR=["Yürüyüş","Koşu","Ağırlık","Bisiklet","Yüzme","Yoga","Diğer"];
function sheetSpor(){
  openSheet(`<h3>Spor ekle</h3><div class="chips" id="sp">${SPOR.map((s,i)=>`<button class="chip" data-sp="${s}" aria-pressed="${i==0}">${s}</button>`).join("")}</div>
  <input class="in num" id="fv" inputmode="numeric" placeholder="Süre (dakika)" autofocus>${dayOptions()}<button class="btn" data-go="spor">Kaydet</button>`);
}
function goSpor(){
  const dk=num($("#fv").value,true);
  if(!(dk>0&&dk<=600))return toast("Süreyi dakika olarak yaz, örneğin 40");
  const pr=document.querySelector("#sp [aria-pressed=true]"),name=pr?pr.dataset.sp:"Antrenman";
  const e=add("spor",dk,name,fday());closeSheet();render();
  const w=sum("spor",keyOff(-6),dayKey());
  toast(`${name} ${Math.round(dk)} dk kaydedildi. Hafta: ${Math.round(w)} / ${S.settings.sportWeek} dk`,e.id);
}
function sheetNot(){openSheet(`<h3>Not ekle</h3><textarea class="in" id="fv" placeholder="Bugün nasıl hissediyorsun?" autofocus></textarea>${dayOptions()}<button class="btn" data-go="not">Kaydet</button>`)}
function goNot(){const t=$("#fv").value.trim();if(!t)return toast("Önce notunu yaz");const e=add("not",null,t,fday());closeSheet();render();toast("Not kaydedildi",e.id)}

function sheetYedek(){
  openSheet(`<h3>Yedekle veya geri yükle</h3><div class="lbl">Yedek metni. Kopyalayıp bir yere kaydet, geri yüklerken buraya yapıştır.</div><textarea class="in" id="bk" spellcheck="false">${esc(JSON.stringify(S))}</textarea>
  <div class="lbl">Parola (isteğe bağlı). Yazarsan yedek şifrelenir ve API anahtarların da içine girer. Parolayı unutursan yedek açılmaz.</div><input class="in" id="bkpw" type="password" autocomplete="new-password">
  <div class="two"><button class="btn ghost" data-go="kopyala">Kopyala</button><button class="btn ghost" data-go="${isNative()?"paylas":"indir"}">${isNative()?"Dosya olarak paylaş":"Dosya indir"}</button></div>
  <div class="btns"><label class="btn ghost" style="text-align:center">Dosyadan oku<input id="bkfile" type="file" accept=".json,application/json,text/plain" hidden></label><button class="btn" data-go="yukle">Bu metinden geri yükle</button></div>`);
}
function markBackup(){S.settings.lastBackup=dayKey();save()}
async function backupText(){
  const pw=$("#bkpw").value;
  return pw?JSON.stringify(await BackupLib.encrypt({v:1,S,keys:getKeys()},pw)):$("#bk").value;
}
async function shareBackup(){
  const P=window.Capacitor&&window.Capacitor.Plugins,fs=P&&P.Filesystem,sh=P&&P.Share;
  if(!fs||!sh)return toast("Paylaşım bu cihazda yok, Kopyala'yı kullan");
  try{
    const f=await fs.writeFile({path:`neowell-yedek-${dayKey()}.json`,data:await backupText(),directory:"CACHE",encoding:"utf8"});
    await sh.share({title:"NeoWell yedeği",files:[f.uri]});markBackup();
  }catch(e){if(!/cancel/i.test(e&&e.message||""))toast("Paylaşılamadı, Kopyala'yı kullan")}
}
async function goYukle(){
  let r,keysIn=null;try{r=JSON.parse($("#bk").value)}catch(e){return toast("Yedek metni okunamadı")}
  if(r&&r.enc){
    const pw=$("#bkpw").value;if(!pw)return toast("Şifreli yedek: önce parolayı yaz");
    try{const p=await BackupLib.decrypt(r,pw);r=p.S;keysIn=p.keys}catch(e){return toast("Parola yanlış ya da yedek bozuk")}
  }
  if(!r||!Array.isArray(r.entries))return toast("Bu bir NeoWell yedeği değil");
  const {out,drop}=cleanEntries(r.entries);
  if(!out.length&&r.entries.length)return toast("Yedekte geçerli kayıt yok");
  if(!confirm(`${out.length} kayıt yüklenecek${drop?`, ${drop} geçersiz kayıt atlanacak`:""}. Mevcut veriler değişecek. Devam edilsin mi?`))return;
  const prevS=S;
  try{localStorage.setItem("koc_v1_onceki",JSON.stringify(prevS))}catch(e){}
  S=Object.assign({settings:cleanSettings(r.settings),entries:out,nextId:out.length+1},cleanGym(r),cleanCoach(r));
  /* Yedek, anahtarın gideceği adresi, onay ayarını ve veri paylaşım iznini değiştirememeli. */
  S.settings.consent=prevS.settings.consent;S.settings.lastBackup=dayKey();
  const keys=getKeys();
  for(const p of S.providers){
    const cur=prevS.providers.find(x=>x.id===p.id),def=defProviders().find(x=>x.id===p.id);
    if(keys[p.id]&&cur)p.base=cur.base;
    if(def)p.confirm=def.confirm;
  }
  if(keysIn&&typeof keysIn==="object")for(const id in keysIn)if(typeof keysIn[id]==="string"&&S.providers.some(p=>p.id===id))setKey(id,keysIn[id]);
  if(!save()){S=prevS;return toast("Yedek yüklenemedi, depolama dolu")}
  logOff=0;closeSheet();render();scheduleReminders().then(setNotif);toast(drop?`Yedek yüklendi, ${drop} geçersiz kayıt atlandı`:"Yedek yüklendi");
}

/* ---------- bildirimler (yalnızca APK) ---------- */
const LN=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
async function scheduleReminders(){
  const ln=LN();if(!ln)return "web";
  try{
    let p=await ln.checkPermissions();
    if(p.display!=="granted")p=await ln.requestPermissions();
    if(p.display!=="granted")return "denied";
    const pend=await ln.getPending();
    if(pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=S.settings.reminders.filter(r=>r.on).map(r=>{const [h,m]=r.t.split(":").map(Number);return {id:r.id,title:r.title,body:r.body,schedule:{on:{hour:h,minute:m},allowWhileIdle:true}}});
    if(list.length)await ln.schedule({notifications:list});
    return "ok";
  }catch(e){return "Bildirimler kurulamadı: "+(e&&e.message||e)}
}
function setNotif(s){notifStatus=s;if(tab==="ayar")render()}

/* ---------- olaylar ---------- */
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-tab],[data-act],[data-del],[data-go],[data-range],[data-fav],[data-sp],[data-lo],[data-g],[data-sex],[data-actl],[data-c]");
  if(ev.target.id==="scrim")return closeSheet();
  if(!el)return;
  const d=el.dataset;
  if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}
  if(d.c){cClick(d.c,el);return}
  if(d.g){gClick(d.g,el);return}
  if(d.sex!==undefined){S.settings.sex=d.sex;save();render();return}
  if(d.actl!==undefined){S.settings.act=+d.actl;save();render();return}
  if(d.range){range=+d.range;render();return}
  if(d.lo){logOff=Math.max(0,Math.min(365,logOff+(+d.lo)));render();return}
  if(d.del){
    const id=+d.del,rm=S.entries.find(e=>e.id===id);if(!rm)return;
    S.entries=S.entries.filter(e=>e.id!==id);save();render();
    toast("Kayıt silindi",()=>{S.entries.push(rm);S.entries.sort((a,b)=>a.id-b.id);save();render()});return;
  }
  if(d.sp){document.querySelectorAll("#sp .chip").forEach(c=>c.setAttribute("aria-pressed",c===el));return}
  if(d.fav!==undefined){const f=favList[+d.fav];if(f){$("#ft").value=f.text;$("#fv").value=f.v?String(Math.round(f.v)):""}return}
  if(d.act){
    if(d.act==="su"){const e=add("su",S.settings.glass);render();const t=dayKey(),top=sum("su",t,t);toast(`+${S.settings.glass} ml, bugün ${Math.round(top)} / ${S.settings.waterMl} ml`+(top-S.settings.glass<S.settings.waterMl&&top>=S.settings.waterMl?". Günlük hedef tamam":""),e.id)}
    else if(d.act==="kilo")sheetKilo();
    else if(d.act==="yemek")sheetYemek();
    else if(d.act==="spor")sheetSpor();
    else if(d.act==="not")sheetNot();
    else if(d.act==="yedek")sheetYedek();
    else if(d.act==="profil"){tab="ayar";render();window.scrollTo(0,0)}
    else if(d.act==="saglik")openSheet(`<h3>Sağlık notların</h3><div class="lbl">Hamilelik, hastalık, ilaç, yeme bozukluğu geçmişi gibi koçun bilmesi gerekenler.</div><textarea class="in" id="hn" maxlength="500" autofocus>${esc(S.settings.healthNote)}</textarea><button class="btn" data-go="saglik">Kaydet</button>`);
    else if(d.act.startsWith("uygula:")){S.settings.kcal=+d.act.slice(7);save();render();toast(`Kalori hedefi ${S.settings.kcal} kcal oldu`)}
    else if(d.act==="sifirla"){if(confirm("Tüm kayıtlar silinecek. Bu geri alınamaz. Devam edilsin mi?")){try{localStorage.removeItem("koc_v1")}catch(e){}S=structuredClone(DEF);save();logOff=0;render();scheduleReminders().then(setNotif);toast("Tüm veriler silindi")}}
    return;
  }
  if(d.go){
    ({kilo:goKilo,yemek:goYemek,spor:goSpor,not:goNot,yukle:goYukle,saglik:()=>{S.settings.healthNote=$("#hn").value.trim().slice(0,500);save();closeSheet();render();toast("Kaydedildi")}}[d.go]||(()=>{}))();
    if(d.go==="kopyala")backupText().then(v=>{(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast("Panoya kopyalandı"),()=>{const b=$("#bk");b.value=v;b.select();document.execCommand&&document.execCommand("copy");toast("Metni seçtim, kopyala")})});
    if(d.go==="paylas")shareBackup();
    if(d.go==="indir")backupText().then(v=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([v],{type:"application/json"}));a.download=`neowell-yedek-${dayKey()}.json`;a.click();markBackup()}catch(e){toast("İndirme bu cihazda çalışmadı, Kopyala'yı kullan")}});
  }
});
$("#tundo").addEventListener("click",()=>{
  const u=lastUndo;lastUndo=null;
  if(typeof u==="function")u();
  else if(u!=null){S.entries=S.entries.filter(e=>e.id!==u);save();render()}
  $("#toast").classList.remove("on");
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="bkfile"){
    const f=t.files&&t.files[0];if(!f)return;
    if(f.size>5e6)return toast("Dosya çok büyük, bir NeoWell yedeği olmayabilir");
    f.text().then(x=>{$("#bk").value=x;toast("Dosya okundu. Devam etmek için geri yükle'ye dokun")},()=>toast("Dosya okunamadı"));
    return;
  }
  if(t.dataset.gi){gInput(t);return}
  if(t.dataset.set){
    const k=t.dataset.set,st=S.settings,[lo,hi,int]=RANGES[k],raw=t.value.trim();
    const show=x=>x?String(x).replace(".",","):"";
    if(raw===""&&ZEROOK.includes(k)){st[k]=0;save();t.value="";toast(`${SETLBL[k]} kapatıldı`);return}
    const v=num(raw,int);
    if(isNaN(v)||v<lo||v>hi){t.value=show(st[k]);toast(`${SETLBL[k]} ${String(lo).replace(".",",")} ile ${String(hi).replace(".",",")} arasında olmalı`);return}
    st[k]=v;save();t.value=show(v);return;
  }
  if(t.dataset.rt||t.dataset.ro){
    const r=S.settings.reminders.find(x=>x.id===+(t.dataset.rt||t.dataset.ro));
    if(t.dataset.rt)r.t=t.value||r.t;else r.on=t.checked;
    save();scheduleReminders().then(setNotif);
  }
});
document.addEventListener("input",ev=>{if(ev.target.id==="gq"){gQuery=ev.target.value;$("#glist").innerHTML=gPickHtml()}});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape")closeSheet();
  if(ev.key==="Enter"&&ev.target.id==="cmsg"){ev.preventDefault();const i=ev.target,t=i.value;i.value="";cSend(t);return}
  if(ev.key==="Enter"&&ev.target.closest("#sheet")&&ev.target.tagName==="INPUT"){const b=$("#sheet [data-go]");if(b)b.click()}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();cFlush();cAuto()}});

render();
if(corruptNote)toast("Kayıtlı veri okunamadı. Eski hali ayrı bir kopyada saklandı.");
scheduleReminders().then(s=>{notifStatus=s;if(tab==="ayar")render()});
setInterval(gTick,1000);
keysInit().then(()=>{render();cAuto();cFlush()});
try{const P=window.Capacitor&&window.Capacitor.Plugins||{};console.log("NW-DIAG "+["LocalNotifications","Share","Filesystem","App"].map(n=>n+"="+typeof P[n]).join(" "))}catch(e){}
setInterval(()=>{if(dayKey()!==lastDay){lastDay=dayKey();logOff=0;render()}},60000);
try{
  const AP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(AP&&AP.addListener)AP.addListener("backButton",()=>{
    if($("#sheet").classList.contains("on"))return closeSheet();
    if(tab!=="bugun"||logOff){tab="bugun";logOff=0;render();return}
    AP.exitApp&&AP.exitApp();
  });
}catch(e){}
</script>
