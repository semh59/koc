<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef2f0">
<title>NeoWell</title>
<link rel="icon" href="logo.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root{
  --bg:#eef2f0; --card:#ffffff; --ink:#10232b; --mut:#56666d; --line:#d9e2de;
  --prim:#0f5c55; --prim-ink:#ffffff; --soft:#e1ece8;
  --su:#2a86bd; --kcal:#b8691a; --spor:#7d56c8; --warn:#b03a24;
  --spor-ink:#ffffff; --tbg:#10232b; --tfg:#eef2f0; --tact:#7cc4f0;
  --r:18px; --r-s:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1618; --card:#16222a; --ink:#e8f0ee; --mut:#8ea0a6; --line:#25353d;
    --prim:#4fc2a8; --prim-ink:#06211c; --soft:#1b2d33;
    --su:#5bb4ea; --kcal:#f0a24f; --spor:#a98cec; --warn:#ef7a62;
    --spor-ink:#1a1030; --tbg:#e8f0ee; --tfg:#0e1618; --tact:#14557d;
  }
}
/* Ayarlar'da Açık/Koyu seçilince sistemden bağımsız; Sistem'de öznitelik yok, üstteki medya sorgusu geçerli. */
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0e1618; --card:#16222a; --ink:#e8f0ee; --mut:#8ea0a6; --line:#25353d;
  --prim:#4fc2a8; --prim-ink:#06211c; --soft:#1b2d33;
  --su:#5bb4ea; --kcal:#f0a24f; --spor:#a98cec; --warn:#ef7a62;
  --spor-ink:#1a1030; --tbg:#e8f0ee; --tfg:#0e1618; --tact:#14557d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 0;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--prim);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{padding:18px 20px 6px;display:flex;align-items:center;gap:12px}
header h1{flex:1;min-width:0;margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
#back{width:44px;height:44px;margin:-10px -10px -10px -14px;flex:none;color:var(--prim)}
header .streak{font-size:14px;color:var(--mut);white-space:nowrap}
header .streak b{color:var(--ink)}
main{flex:1;padding:6px 16px calc(92px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.i{width:1.25em;height:1.25em;vertical-align:-.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#back .i,#csend .i{width:24px;height:24px;vertical-align:middle}

.stepcard .wv{color:var(--prim)}.stepcard .wv small{font-size:15px;font-weight:600}.stepcard .ws{text-align:right;max-width:60%}

.coach{display:block;width:100%;min-height:44px;margin:0 0 12px;padding:4px;text-align:left;color:var(--mut);font-size:15px}.coach b{color:var(--prim);white-space:nowrap}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-4px 0 12px}.hrow .btn{min-height:44px;padding:8px 10px}
.todo .row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}.todo .row:first-of-type{border-top:0}.todo .row>span{flex:1;min-width:0;overflow-wrap:anywhere}.todo small.sm{display:block}

.card{background:var(--card);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:12px;border:1px solid var(--line)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stepcard{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 12px}.stepcard:focus-visible{outline:2px solid var(--prim)}.stepcard .row{display:flex;justify-content:space-between;align-items:baseline}.stepcard .big{font-size:26px;font-weight:800}
.bars text{font-size:11px;fill:var(--mut)}
.ring{position:relative}
.ring svg{width:88px;height:88px;display:block;margin:0 auto}
.ring .rt{fill:none;stroke:var(--soft);stroke-width:8}
.macro{font-size:13px;color:var(--mut);margin:-4px 2px 12px}
.about{display:flex;flex-direction:column;align-items:center;gap:4px;margin:24px 0 8px;font-size:17px}
.about img{border-radius:50%}
.ring .rp{fill:none;stroke-width:8;stroke-linecap:round}
.ring .rc{position:absolute;left:0;right:0;top:24px;font-weight:700;font-size:16px;line-height:1.15}.ring .rc small{display:block;font-size:11px;font-weight:600;color:var(--mut)}
.ring .rl{font-weight:600;font-size:14px;margin-top:2px}
.ring .rs{font-size:12.5px;color:var(--mut)}

.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;min-height:68px;transition:transform .08s}
.act:active{transform:scale(.95)}
.act .ic .i{width:26px;height:26px}
.act[data-act=su] .ic{color:var(--su)}.act[data-act=yemek] .ic{color:var(--kcal)}.act[data-act=kilo] .ic{color:var(--prim)}.act[data-act=spor] .ic{color:var(--spor)}.act[data-act=not] .ic{color:var(--mut)}
.act.su{border-color:color-mix(in srgb,var(--su) 55%,var(--line))}

h2{font-size:15px;margin:18px 4px 8px;font-weight:700}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .t{color:var(--mut);font-size:13px;width:42px;flex:none}
.log .ic{width:22px;text-align:center;flex:none;color:var(--mut)}
.log .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.log .vl{color:var(--mut);font-size:14px;white-space:nowrap}
.del{width:44px;height:44px;margin:-8px 0;border-radius:50%;color:var(--mut);font-size:18px;flex:none}
.dnav{display:flex;align-items:center;justify-content:space-between}
.dnav h2{flex:1;text-align:center;margin:10px 4px 4px}
.dnav button{width:44px;height:44px;border-radius:50%;font-size:24px;color:var(--mut)}
.dnav button:disabled{opacity:.3;cursor:default}
.del:active{background:var(--soft)}.log .del{margin:-6px -6px -6px 0}
.log .gh{padding:8px 4px 4px;justify-content:space-between;font-size:13px;color:var(--mut);border-bottom:0}.log .gh b{font-weight:700}.log button.tx{text-align:left;min-height:44px;margin:-8px 0}.qrow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.qrow .btn{width:auto;flex:1 1 auto;margin:0!important;min-height:44px;padding:8px 12px;font-size:14px}
.hint{color:var(--mut);font-size:14px;padding:6px 4px 2px}

/* Trend */
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;margin:2px 0 10px}
.seg button{min-height:44px;padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.chart{width:100%;height:auto;display:block}
.srch{display:flex;gap:8px;align-items:center;margin-bottom:8px}.srch .in{flex:1;min-width:0;margin:0}.srch .btn{width:auto;min-height:48px;padding:0 16px;background:var(--soft)}.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--prim);color:var(--prim-ink);font-size:12px;line-height:20px}.empty{text-align:center}.empty .btn{margin-top:4px}.chart{touch-action:pan-y}.chart text{fill:var(--mut);font-size:12px}.chart .tip text{fill:var(--ink)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:6px}
.stat .k{font-size:13px;color:var(--mut)}
.stat .v{font-size:20px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--mut);text-align:right;padding:4px 4px 8px;font-size:13px}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
td.today,th.today{font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--spor);border-radius:99px}

/* Koç */
#composer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:6;background:var(--bg);padding:6px 12px 8px;max-width:520px;margin:0 auto}
#composer[hidden]{display:none}
.chiprow{display:flex;gap:6px;margin-bottom:6px;overflow:hidden}.chiprow .chip{flex:1 1 auto;min-height:44px;padding:0 8px;font-size:13.5px;border:1px solid var(--mut);background:var(--card)}
.cin{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--mut);border-radius:26px;padding:0 4px 0 16px;height:50px}
.cin input{align-self:stretch;flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
#csend{width:44px;height:44px;border-radius:50%;background:var(--prim);color:var(--prim-ink);font-size:18px}
body.koc main{padding-bottom:calc(200px + env(safe-area-inset-bottom))}
body.koc #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
.chat{display:flex;flex-direction:column;gap:12px}
.ub{align-self:flex-end;max-width:84%;background:color-mix(in srgb,var(--prim) 22%,var(--card));border-radius:18px 18px 4px 18px;padding:10px 14px;overflow-wrap:anywhere;white-space:pre-wrap}
.pendl{align-self:flex-end;margin-top:-8px;font-size:13px;color:var(--mut)}
.cm{padding:0 4px}.cm p{margin:0;font-size:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.dots{letter-spacing:3px;color:var(--mut)}
.banner{background:#fbeede;border:1px solid #ecd0a8;color:#4d2f07;border-radius:16px;padding:14px;margin-bottom:12px}
.banner.info{background:#e6f0f6;border-color:#b9d3e3;color:#14425e}
.banner p{margin:2px 0 10px;font-size:14.5px;line-height:1.45}.banner .btn{width:auto;padding:11px 18px}
.scard{background:#e6f0f6;border:1px solid #b9d3e3;color:#10232b;border-radius:16px;padding:14px;margin-top:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scard{background:#16303d;border-color:#2a4b5d;color:#e8f0ee}:root:not([data-theme="light"]) .banner{background:#3a2a14;border-color:#5b4322;color:#f3dcb8}:root:not([data-theme="light"]) .banner.info{background:#16303d;border-color:#2a4b5d;color:#d5e8f3}}
:root[data-theme="dark"] .scard{background:#16303d;border-color:#2a4b5d;color:#e8f0ee}:root[data-theme="dark"] .banner{background:#3a2a14;border-color:#5b4322;color:#f3dcb8}:root[data-theme="dark"] .banner.info{background:#16303d;border-color:#2a4b5d;color:#d5e8f3}
.scard b{font-size:17px}.scard p{margin:6px 0 10px;font-size:15px;line-height:1.5}
.srow2{display:flex;gap:8px;margin-bottom:8px}.sbtn{flex:1;min-height:46px;border-radius:12px;background:#1f5f86;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none}
.sbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.lcard{margin:8px 0 0}.lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.chip:disabled{opacity:.5;cursor:default}
.tahmin{font-size:12px;font-weight:600;color:#6b3f08;background:#fbe9d2;border-radius:99px;padding:3px 10px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.kin{width:64px;height:44px;text-align:right;border:1px solid var(--mut);border-radius:8px;background:var(--bg);padding:0 6px}
.lbtns{display:flex;gap:8px;margin-top:10px}.lbtns .btn{padding:12px}
.chkrow{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}.chkrow input{width:22px;height:22px}
/* Salon */
.mut{color:var(--mut)}.sm{font-size:13px;display:block}
.trow{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px}
.tmain{flex:1;text-align:left;display:grid;gap:1px;min-height:44px;padding:4px 0}
.tmain .mut{font-size:13px}
.rrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;min-height:44px}
.rrow:last-child{border-bottom:0}.rrow .tx{flex:1}
.gbar{display:grid;grid-template-columns:92px 1fr 28px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.gbar .bar{margin:0}
.livebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 4px 10px}
.livebar b{font-size:18px}.fin{width:auto;padding:11px 20px}
.fig{width:100%;height:auto;display:block}
#guide{position:fixed;inset:0;z-index:15;max-width:520px;margin:0 auto;background:var(--card);display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom));overflow-y:auto}#guide[hidden]{display:none}body.gdon{overflow:hidden}
.gdtop{display:flex;align-items:center;gap:8px;min-height:44px}.gdtop b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gdx{width:44px;height:44px;font-size:22px;color:var(--mut);flex:none}
.gdbar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;flex:none}.gdbar i{display:block;height:100%;width:0;background:var(--prim)}
.gdfig{flex:1 1 140px;min-height:110px;max-height:240px;display:flex;justify-content:center;margin:8px 0 4px;background:var(--bg);border-radius:16px;overflow:hidden}.gdfig .fig{height:100%;width:auto;max-width:100%}
.gdl{text-align:center;font-size:14px;font-weight:700;color:var(--mut)}.gdn{text-align:center;font-size:24px;margin:0;line-height:1.2}.gdc{text-align:center;color:var(--mut);font-size:15px;margin:2px 0 4px}
.gdring{position:relative;width:min(44vw,180px);margin:2px auto;flex:none}.gdring svg{display:block;width:100%;transform:rotate(-90deg)}.gdring circle{fill:none;stroke-width:9}.gdring .tr{stroke:var(--soft)}.gdring .pg{stroke:var(--prim);stroke-linecap:round}.gdring.gdrs .pg{stroke:var(--su)}
.gdtm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.gdtm b{font-size:44px;line-height:1}
.gdnx{display:flex;align-items:baseline;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px;margin:6px 0 0;flex:none}.gdnx b{flex:1;min-width:0;overflow-wrap:anywhere}
.gdctl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-top:8px;flex:none}.gdctl .btn{min-height:56px;padding:8px}.gdrem{text-align:center;margin:6px 0 0}#guide .hint{text-align:center;padding:4px 0 0}
.fg-far{stroke:var(--mut);opacity:.75}.fg-body,.fg-near{stroke:var(--prim)}.fg-head{stroke:var(--prim);fill:var(--card);stroke-width:2.6}
.fg-prop{stroke:var(--kcal)}.fg-plate{stroke:var(--kcal);fill:color-mix(in srgb,var(--kcal) 35%,var(--card));stroke-width:1.6}.fg-floor{stroke:var(--line)}
.exrow{gap:12px}.exthumb{flex:none;width:72px;height:54px;background:var(--bg);border-radius:10px;padding:2px}
.exvis{display:flex;gap:8px;margin:10px 0}.exfig,.exph{flex:1;min-width:0;background:var(--bg);border-radius:14px;padding:4px;display:flex;align-items:center}

@keyframes exflip{0%,49%{opacity:0}50%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.exph img.b{animation:none}}
.cues{margin:8px 0 10px;padding-left:20px;font-size:14.5px}.cues li{margin:3px 0}
.tgo{font-size:18px;color:var(--prim)}.rest.tim{background:color-mix(in srgb,var(--prim) 14%,var(--card));border-color:color-mix(in srgb,var(--prim) 40%,var(--line))}
.rest{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--spor) 14%,var(--card));border:1px solid color-mix(in srgb,var(--spor) 35%,var(--line));border-radius:16px;padding:8px 10px;margin-bottom:10px}
.rest[hidden]{display:none}.rest>div{flex:1;display:grid}.rest b{font-size:26px;line-height:1.1}
.rest button{min-width:44px;height:44px;border-radius:10px;background:var(--card);font-weight:700;font-size:14px;padding:0 10px}
.ex{padding:8px 10px 6px}.exh{display:flex;align-items:center}
.exn{flex:1;text-align:left;display:grid;min-height:44px;align-content:center}.exn b{font-size:17px}.exn .mut{font-size:13px}
.sug{font-size:13px;color:var(--spor);margin:0 4px 6px}.note{font-size:13px;color:var(--mut);margin:0 4px 6px;font-style:italic}

.srow{padding:3px 4px;border-radius:12px;margin-bottom:4px}.shead.r,.srow.r{grid-template-columns:22px 1fr 56px 56px 50px 44px;gap:6px}.srow.r .sp{font-size:12px;white-space:nowrap;letter-spacing:-.02em}
.srow.nx{outline:2px solid color-mix(in srgb,var(--spor) 60%,var(--line));outline-offset:-1px}
.sx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 4px 8px}.stp{flex:1 1 130px;display:flex;align-items:center;background:var(--soft);border-radius:12px}.stp span{flex:1;text-align:center;font-weight:800;font-size:17px}.stp button{width:44px;height:44px;font-size:22px;font-weight:700;border-radius:12px}.sxs{flex:1 0 100%;margin:0}
.srow.dn{background:color-mix(in srgb,var(--spor) 12%,var(--card))}
.sn{text-align:center;font-weight:700;color:var(--mut)}.sn.tb{width:44px;height:44px;justify-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-size:inherit;position:relative;z-index:1;background:none}.mmwrap svg{display:block;width:100%;height:auto;max-width:340px;margin:0 auto}.mmb{fill:var(--soft);stroke:var(--mut);stroke-width:.8}.mmr{fill:var(--soft);stroke:var(--mut);stroke-width:.8;cursor:pointer}.mmr.on{stroke:var(--ink);stroke-width:2}.mmr:focus-visible{outline:none;stroke:var(--ink);stroke-width:2}

function viewTrend(){
  const t=dayKey(),st=S.settings;
  const wAll=weights(),days=Object.keys(wAll).sort();
  let stats="";
  if(days.length){
    const cur=wAll[days[days.length-1]],first=wAll[days[0]];
    const ge=Algo.goalEta(wAll,st.goalKg),cells=[["Başlangıç",`${fmt(first)} kg`],["Şimdi",`${fmt(cur)} kg`],["Toplam değişim",`${fmtS(cur-first)} kg`]];
    if(ge.slope!=null)cells.push(["Kilo hızı",`${fmtS(ge.slope,2)} kg/hafta`]);
    const gi=goalInfo(cur,first);
    if(gi)cells.push(["Hedefe kalan",gi.done?"Ulaştın":`${fmt(gi.left)} kg`]);
    const eta=gi&&!gi.done&&!(gi.dir<0&&Algo.lossBlock({age:st.age,cm:st.heightCm,kg:cur,goalKg:st.goalKg,health:!!st.healthNote.trim()}))?ge.weeks:null;
    stats=`<div class="stats">${cells.map(c=>`<div class="stat"><div class="k">${c[0]}</div><div class="v num">${c[1]}</div></div>`).join("")}</div>${eta?`<p class="hint" style="padding:8px 0 0">Son 3 haftanın eğimi sürerse ~${eta} hafta.</p>`:""}`;
  }
  let rows="",hasWeek=false;
  for(let i=6;i>=0;i--){
    const d=addDays(-i),k=dayKey(d),w=weights(k,k)[k],su=sum("su",k,k),kc=sum("yemek",k,k),sp=sum("spor",k,k),as=sum("adim",k,k);
    if(w!=null||su||kc||sp||as)hasWeek=true;
    rows+=`<tr><td class="${i==0?"today":""}">${GUNK[d.getDay()]} ${d.getDate()}</td><td class="num">${w!=null?fmt(w):"–"}</td><td class="num">${su?fmt(su/1000,1):"–"}</td><td class="num">${kc?Math.round(kc):"–"}</td><td class="num">${sp?Math.round(sp):"–"}</td><td class="num">${as?Math.round(as).toLocaleString("tr-TR"):"–"}</td></tr>`;
  }
  const sw=sum("spor",keyOff(-6),t),pct=Math.min(sw/st.sportWeek,1)*100;
  const sd=new Set(S.entries.filter(e=>e.type==="spor"&&e.day>=keyOff(-6)).map(e=>e.day)).size;
  const empty=`<div class="card empty"><b>Henüz tartı kaydı yok</b><p class="mut sm">İlk tartını gir, grafik ikinci tartıdan sonra çizilir. Su, yemek, spor ve adım kayıtların da burada haftalık tabloya girer.</p><button class="btn" data-act="kilo">${Icons.svg("kilo")} Kilo ekle</button></div>`;
  return `${days.length?`<div class="seg" role="group" aria-label="Aralık"><button data-range="30" aria-pressed="${range==30}">30 gün</button><button data-range="90" aria-pressed="${range==90}">90 gün</button></div>
  <div class="card">${chart(range)}${stats}</div>`:empty}
  ${lossAsk()?`<div class="btns"><button class="btn ghost" data-c="why">Bu hafta neden kilo vermedim?</button></div>`:""}
  ${gEnergy()}
  ${measureCard()}
  ${hasWeek?`<h2>Son 7 gün</h2><div class="card"><table><thead><tr><th>Gün</th><th>Kilo</th><th>Su (L)</th><th>kcal</th><th>Spor (dk)</th><th>Adım</th></tr></thead><tbody>${rows}</tbody></table></div>`:""}
  ${vTrendCards()}
  <h2>Tahlil</h2>${labTrendCard()}
  <h2>Haftalık spor</h2><div class="card"><div class="num"><b>${Math.round(sw)}</b> / ${st.sportWeek} dk, ${sd} gün aktif</div><div class="bar"><i style="width:${pct.toFixed(0)}%"></i></div></div>
  ${reportsCard()}`;
}

function render(){

  const ttl={bugun:`${fd(dayKey())}, ${GUN[new Date().getDay()]}`,koc:"Koç",salon:"Salon",trend:"Trend",daha:"Daha fazla",ayar:"Ayarlar",egz:"Egzersizler",adim:"Adım raporu",tahlil:"Tahlil takibi",tansiyon:"Tansiyon",seker:"Şeker",ilac:"İlaçlar",...Object.fromEntries(AYAR.map(([k,t])=>["ayar-"+k,t]))}[tab];
  $("#ttl").textContent=ttl;
  const n=streak();$("#streak").innerHTML=n>0?`<b class="num">${n}</b> günlük seri`:"";
  v.innerHTML=(saveFail&&tab!=="bugun"&&tab!=="ayar-veri"?`<div class="card todo" role="alert"><div class="row"><span>${Icons.svg("save")} <b>${storeMsg()[0]}</b><small class="mut sm">${storeMsg()[1]}</small></span><button class="chip" data-act="veriyedek">Yedek al</button></div></div>`:"")+(tab==="koc"?viewKoc():tab==="bugun"?viewBugun():tab==="salon"?viewSalon():tab==="trend"?viewTrend():tab==="adim"?viewAdim():tab==="tahlil"?viewTahlil():tab==="tansiyon"?viewTansiyon():tab==="seker"?viewSeker():tab==="egz"?viewEgz():tab==="ilac"?viewIlac():tab==="daha"?viewDaha():viewAyar());
  document.body.classList.toggle("koc",tab==="koc");$("#composer").hidden=tab!=="koc";
  if(tab==="koc")cScroll();
  document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.tab===topTab(tab))b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});

  if(UP(tab)&&!history.state)history.pushState({sub:1},"");else if(!UP(tab)&&history.state)history.replaceState(null,"");

}

let widgetLast="";
/* null değerler bilinçli: Java tarafı anahtar varsa ama null ise "hedef yok"/adım gizli, anahtar yoksa "–" gösterir. */
function widgetPush(){
  if(!WG())return;

    lastSched=now;
    if(S.settings.medOn){
      for(const n of MedLib.notifications(S.meds,S.medLog,new Date(),SCHED_DAYS,S.settings.medShowName!==false))list.push({id:n.id,title:n.title,body:n.body,schedule:{at:n.at,allowWhileIdle:true},actionTypeId:n.actionTypeId,extra:n.extra,channelId:n.channelId,ongoing:n.ongoing});
    }
    if(S.fast.t0){const at=new Date(S.fast.t0+S.fast.plan*36e5);if(at.getTime()>now+5000)list.push({id:9100,title:"⏳ Oruç",body:"Oruç süren doldu. İstediğinde bitirebilirsin.",schedule:{at,allowWhileIdle:true}})}

    list.sort((a,b)=>a.schedule.at-b.schedule.at);if(list.length>MedLib.BUDGET)list.length=MedLib.BUDGET;
    if(list.length)await ln.schedule({notifications:list});

  }catch(e){return "Bildirimler kurulamadı: "+(e&&e.message||e)}
}

function setSteps(day,v){
  if(!(v>0&&v<=200000)||day<S.settings.stepsFrom)return false; // silinen adımlar sensör geçmişinden geri yazılmaz
  const e=S.entries.find(x=>x.type==="adim"&&x.day===day&&x.text!=="elle");
  if(e){if(e.v===v)return false;e.v=v}
  else S.entries.push({id:S.nextId++,day,time:"00:00",type:"adim",v,text:""});
  return true;
}
async function stepsSync(){
  if(!S.settings.stepsOn||!SC())return;
  try{
    const r=await SC().read();let ch=!stepsRead;stepsRead=true;
    if(stepSnapAt!==(+r.snapAt||0)){stepSnapAt=+r.snapAt||0;ch=true}
    for(const d in (r.history||{}))if(dayOk(d)&&setSteps(d,r.history[d]))ch=true;
    if(typeof r.steps==="number"){if(stepToday!==r.steps){stepToday=r.steps;ch=true}if(setSteps(dayKey(),r.steps))ch=true}
    if(ch){save();if((tab==="bugun"||tab==="adim")&&!$("#sheet").classList.contains("on"))render();else widgetPush()}

}

    return;
  }
  if(d.go){
    ({kilo:goKilo,yemek:goYemek,besin:goBesin,mysil:goMySil,tpl:goTpl,adim:goAdim,spor:goSpor,not:goNot,yukle:goYukle,saglik:()=>{S.settings.healthNote=$("#hn").value.trim().slice(0,500);save();closeSheet();render();toast("Kaydedildi")}}[d.go]||(()=>{}))();
    if(d.go==="kopyala")backupText().then(v=>{(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast("Panoya kopyalandı"),()=>{const b=$("#bk");b.value=v;b.select();document.execCommand&&document.execCommand("copy");toast("Metni seçtim, kopyala")})});
    if(d.go==="paylas")shareBackup();
    if(d.go==="indir")backupText().then(v=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([v],{type:"application/json"}));a.download=`neowell-yedek-${dayKey()}.json`;a.click();markBackup()}catch(e){toast("İndirme bu cihazda çalışmadı, Kopyala'yı kullan")}});
  }
});
$("#tundo").addEventListener("click",()=>{
  const u=lastUndo;lastUndo=null;
  if(typeof u==="function")u();
  else if(u!=null){S.entries=S.entries.filter(e=>e.id!==u);save();render()}

});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="bkfile"){
    const f=t.files&&t.files[0];if(!f)return;
    if(f.size>5e6)return toast("Dosya çok büyük, bir NeoWell yedeği olmayabilir");
    f.text().then(x=>{$("#bk").value=x;toast("Dosya okundu. Devam etmek için geri yükle'ye dokun")},()=>toast("Dosya okunamadı"));
    return;
  }
  if(t.dataset.gi){gInput(t);return}
  if(t.dataset.mk!==undefined){S.settings.moveKcalOn=t.checked;save();return}
  if(t.dataset.rpe!==undefined){S.settings.rpeOn=t.checked;save();return}
  if(t.dataset.gdv!==undefined){S.settings.gdVoice=t.checked;save();return}
  if(t.dataset.gdb!==undefined){S.settings.gdVib=t.checked;save();return}
  if(t.dataset.aw!==undefined){S.settings.awakeOn=t.checked;save();gAwake();return}
  if(t.dataset.set){
    const k=t.dataset.set,st=S.settings,[lo,hi,int]=RANGES[k],raw=t.value.trim();
    const show=x=>x?String(x).replace(".",","):"";
    if(raw===""&&ZEROOK.includes(k)){st[k]=0;save();t.value="";toast(`${SETLBL[k]} kapatıldı`);return}
    const v=num(raw,int);
    if(isNaN(v)||v<lo||v>hi){t.value=show(st[k]);toast(`${SETLBL[k]} ${String(lo).replace(".",",")} ile ${String(hi).replace(".",",")} arasında olmalı`);return}
    st[k]=v;if(k==="age")cAgeGuard();save();t.value=show(v);return;
  }
  if(t.dataset.rt||t.dataset.ro){
    const r=S.settings.reminders.find(x=>x.id===+(t.dataset.rt||t.dataset.ro));
    if(t.dataset.rt)r.t=t.value||r.t;else r.on=t.checked;
    save();scheduleReminders().then(setNotif);
  }
});

});
document.addEventListener("keydown",ev=>{

});

try{

/* Android geri tuşu: sayfa, onboarding adımı, alt ekran, Bugün sırasıyla; false dönerse uygulamadan çıkılır. */
function backKey(){
  if(gdBack())return true;
  if($("#sheet").classList.contains("on")){closeSheet();return true}
  if(obNeeded()&&ob.step){ob.step--;render();return true}
  if(UP(tab)){goBack();return true}
  if(tab!=="bugun"||logOff){tab="bugun";logOff=0;render();return true}
  return false;
}
$("#back").addEventListener("click",goBack);
