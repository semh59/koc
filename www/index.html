<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f4f3">
<title>NeoWell</title>
<link rel="icon" href="logo.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
/* Tasarım token'ları: kurallar docs/tasarim-dili.md'de. Renkler 6 haneli hex olmalı (contrast.test.js okur). */
:root{
  /* Kenar boşlukları: Capacitor SystemBars --safe-area-inset-* yazar; WebView 140 öncesinde env() Android'de yanlış döner. */
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  --sal:var(--safe-area-inset-left,env(safe-area-inset-left,0px)); --sar:var(--safe-area-inset-right,env(safe-area-inset-right,0px));
  --bg:#f2f4f3; --card:#ffffff; --ink:#10232b; --mut:#56666d; --line:#dfe5e2;
  --prim:#0f5c55; --prim-btn:#0f5c55; --prim-ink:#ffffff; --soft:#e7eeeb; --prim-soft:#d7ebe5; --field:#f4f6f5; --fbd:#7d898f;
  --su:#2a86bd; --kcal:#b8691a; --spor:#7d56c8; --warn:#b03a24;
  --spor-ink:#ffffff; --tbg:#10232b; --tfg:#eef2f0; --tact:#7cc4f0;
  --ban-bg:#fbeede; --ban-bd:#ecd0a8; --ban-ink:#4d2f07; --inf-bg:#e8f1f6; --inf-bd:#c3d9e6; --inf-ink:#14425e;
  --tah-bg:#fbe9d2; --tah-ink:#6b3f08; --ok:#2b7a3b; --info:#1f5f86; --info-ink:#ffffff; --knob:#ffffff;
  --scrim:rgb(6 14 17/.5);
  --sh-1:0 1px 2px rgb(16 35 43/.06),0 2px 8px rgb(16 35 43/.04); --sh-2:0 6px 24px rgb(16 35 43/.18); --card-bd:transparent;
  /* Yarıçap: 8/12/16/24 ve hap; daire için 50%. */
  --r-xs:8px; --r-s:12px; --r:16px; --r-xl:24px; --r-pill:999px;
  /* Tip ölçeği: yalnız bu basamaklar; 12 altı yasak (scripts/design.test.js). */
  --fs-cap:12px; --fs-s:13px; --fs-2:15px; --fs-1:16px; --fs-h3:18px; --fs-h2:20px; --fs-h1:24px; --fs-num:34px; --fs-svg:14px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --ring-w:7px; --nav-h:56px; --toast-b:calc(var(--nav-h) + 28px + var(--nx,0px) + var(--sab));
  --ease:cubic-bezier(.2,.8,.2,1); --dur-1:.12s; --dur:.2s; --dur-3:.32s; --dur-sheet:.24s;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1416; --card:#152024; --ink:#e8f0ee; --mut:#92a4aa; --line:#26353b;
    --prim:#4fc2a8; --prim-btn:#3fa890; --prim-ink:#06211c; --soft:#1c2a2f; --prim-soft:#163a34; --field:#101a1d; --fbd:#6c7c82;
    --su:#5bb4ea; --kcal:#f0a24f; --spor:#a98cec; --warn:#ef7a62;
    --spor-ink:#1a1030; --tbg:#e8f0ee; --tfg:#0e1618; --tact:#14557d;
    --ban-bg:#3a2a14; --ban-bd:#5b4322; --ban-ink:#f3dcb8; --inf-bg:#16303d; --inf-bd:#2a4b5d; --inf-ink:#d5e8f3;
    --tah-bg:#4a3313; --tah-ink:#f6d9b0; --ok:#6fcf8a; --info:#1f5f86; --info-ink:#ffffff; --knob:#ffffff;
    --scrim:rgb(0 0 0/.6);
    --sh-1:none; --sh-2:0 0 0 1px var(--line); --card-bd:#22313a;
  }
}
/* Ayarlar'da Açık/Koyu seçilince sistemden bağımsız; Sistem'de öznitelik yok, üstteki medya sorgusu geçerli. */
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;
    --bg:#0c1416; --card:#152024; --ink:#e8f0ee; --mut:#92a4aa; --line:#26353b;
    --prim:#4fc2a8; --prim-btn:#3fa890; --prim-ink:#06211c; --soft:#1c2a2f; --prim-soft:#163a34; --field:#101a1d; --fbd:#6c7c82;
    --su:#5bb4ea; --kcal:#f0a24f; --spor:#a98cec; --warn:#ef7a62;
    --spor-ink:#1a1030; --tbg:#e8f0ee; --tfg:#0e1618; --tact:#14557d;
    --ban-bg:#3a2a14; --ban-bd:#5b4322; --ban-ink:#f3dcb8; --inf-bg:#16303d; --inf-bd:#2a4b5d; --inf-ink:#d5e8f3;
    --tah-bg:#4a3313; --tah-ink:#f6d9b0; --ok:#6fcf8a; --info:#1f5f86; --info-ink:#ffffff; --knob:#ffffff;
    --scrim:rgb(0 0 0/.6);
    --sh-1:none; --sh-2:0 0 0 1px var(--line); --card-bd:#22313a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:var(--fs-1)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding:var(--sat) var(--sar) 0 var(--sal);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--prim);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{padding:16px 20px 8px;display:flex;align-items:center;gap:12px;min-height:60px}
header h1{flex:1;min-width:0;margin:0;font-size:var(--fs-h1);font-weight:700;letter-spacing:-.02em;line-height:1.2}
#back{width:44px;height:44px;margin:-10px -10px -10px -14px;flex:none;color:var(--ink);border-radius:50%}
#back:active{background:var(--soft)}
header .streak{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-s);font-weight:600;color:var(--mut);white-space:nowrap;background:var(--card);box-shadow:var(--sh-1);border:1px solid var(--card-bd);border-radius:var(--r-pill);padding:var(--sp-1) 10px var(--sp-1) var(--sp-2)}
header .streak:empty{display:none}
header .brand{vertical-align:-5px;margin-right:10px}
header .streak b{color:var(--ink)}
header .streak .i{width:16px;height:16px;color:var(--kcal)}
main{flex:1;padding:4px 16px calc(92px + var(--nx,0px) + var(--sab))}
.num,.stat .v,.big,.rc,td,.sumv{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.i{width:1.25em;height:1.25em;vertical-align:-.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#back .i,#csend .i{width:24px;height:24px;vertical-align:middle}

.stepcard .wv{color:var(--prim)}.stepcard .wv small{font-size:var(--fs-2);font-weight:600}.stepcard .ws{text-align:right;max-width:60%;font-size:var(--fs-2);font-weight:600;color:var(--ink);line-height:1.3}

.coachc{padding:8px 16px}.coach{display:block;width:100%;min-height:44px;margin:0;padding:0;text-align:left;color:var(--mut);font-size:var(--fs-2);line-height:1.45}.coach b{color:var(--prim);white-space:nowrap}
.hrow{display:flex;justify-content:flex-end;margin:-4px 0 12px}.hrow .chip{background:var(--card);color:var(--mut);box-shadow:var(--sh-1);border:1px solid var(--card-bd)}
/* Büyük yazıda metin harf harf sütuna dönmez: metin en az ~10 harf genişlikte kalır, eylem gerekirse alt satıra iner. */
.todo .row{gap:var(--sp-2);flex-wrap:wrap}.todo .row:first-of-type{border-top:0}.todo .row>span{flex:1 1 10em;min-width:0;overflow-wrap:break-word}.todo .row>.chip,.todo .row>button:last-child{margin-left:auto}.todo small.sm{display:block}

.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--card-bd);box-shadow:var(--sh-1)}
.rings{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:6px;text-align:center;align-items:start}
.stepcard{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:var(--card);border:1px solid var(--card-bd);box-shadow:var(--sh-1);border-radius:var(--r);padding:16px;margin:0 0 12px;transition:transform var(--dur) var(--ease)}.stepcard:active{transform:scale(.985)}.stepcard:focus-visible{outline:2px solid var(--prim)}.stepcard .scr{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-2)}.stepcard .big{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.02em}
/* SVG metinleri viewBox biriminde (340 genişlik): --fs-svg 14 birim 360 px ekranda ≈12 px; büyük yazıda 16 birimde durur, eksen etiketi grafikten taşmaz. */
.bars text,.chart text,.lsv text{font-size:min(var(--fs-svg),16px);fill:var(--mut)}
.ring{position:relative}
.ring{--rs:min(84px,22.5vw)}.ring.main{--rs:clamp(104px,31vw,132px)}.ring svg{width:var(--rs);height:var(--rs);display:block;margin:0 auto}
.ring .rt{fill:none;stroke:var(--soft);stroke-width:var(--ring-w)}
.macro{font-size:var(--fs-s);color:var(--mut);margin:-4px 4px 12px;line-height:1.5}
.about{display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);margin:var(--sp-5) 0 var(--sp-2);font-size:var(--fs-h3)}
.about img{border-radius:var(--r-xl);box-shadow:var(--sh-1)}
.ring .rp{fill:none;stroke-width:var(--ring-w);stroke-linecap:round}
.ring .rc{position:absolute;left:0;right:0;top:0;height:var(--rs);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:min(var(--fs-h3),calc(var(--rs)*.26));line-height:1.1;letter-spacing:-.01em;padding:0 calc(var(--ring-w) + 4px);text-align:center}.ring .rc small{display:block;font-size:min(var(--fs-cap),calc(var(--rs)*.15));font-weight:600;color:var(--mut);letter-spacing:0}.ring.main .rc{font-size:min(var(--fs-num),calc(var(--rs)*.28))}.ring.main .rc small{font-size:min(var(--fs-cap),calc(var(--rs)*.12))}.ring.main .rl{font-size:var(--fs-1)}.ring.done .rc{color:var(--prim)}.ring.done .rc small{max-width:calc(var(--rs) - 2*var(--ring-w) - 8px);line-height:1.1}
.ring .rl{font-weight:600;font-size:var(--fs-2);margin-top:6px}
.ring .rs{font-size:var(--fs-cap);color:var(--mut)}

.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.act{background:var(--card);border:1px solid var(--card-bd);box-shadow:var(--sh-1);border-radius:var(--r);padding:var(--sp-3) var(--sp-1) var(--sp-2);display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);font-size:var(--fs-cap);font-weight:600;min-height:68px;min-width:0;overflow-wrap:normal;word-break:keep-all;transition:transform var(--dur) var(--ease)}
.act:active{transform:scale(.95)}
.act .ic .i{width:24px;height:24px}
.act[data-act=su] .ic{color:var(--su)}.act[data-act=yemek] .ic{color:var(--kcal)}.act[data-act=kilo] .ic{color:var(--prim)}.act[data-act=spor] .ic{color:var(--spor)}.act[data-act=not] .ic{color:var(--mut)}
.act.su{border-color:color-mix(in srgb,var(--su) 45%,var(--card))}

h2{font-size:var(--fs-h2);margin:var(--sp-5) var(--sp-1) var(--sp-3);font-weight:700;letter-spacing:-.01em}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .t{color:var(--mut);font-size:var(--fs-s);width:42px;flex:none}
.log .ic{width:22px;text-align:center;flex:none;color:var(--mut)}
.log .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.log .vl{color:var(--mut);font-size:var(--fs-s);white-space:nowrap}
.del{width:44px;height:44px;margin:-8px 0;border-radius:50%;color:var(--mut);font-size:var(--fs-h3);flex:none}
.dnav{display:flex;align-items:center;justify-content:space-between}
.dnav h2{flex:1;text-align:center;margin:12px 4px 6px;font-size:var(--fs-2)}
.dnav button{width:44px;height:44px;border-radius:50%;font-size:var(--fs-h1);color:var(--mut)}
.dnav button:disabled{opacity:.3;cursor:default}
.del:active{background:var(--soft)}.log .del{margin:-6px -6px -6px 0}
.log .gh{padding:12px 4px 4px;justify-content:space-between;font-size:var(--fs-cap);font-weight:600;color:var(--mut);border-bottom:0;text-transform:uppercase;letter-spacing:.04em}.log .gh b{font-weight:700}.log button.tx{text-align:left;min-height:44px;margin:-8px 0}.qrow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.qrow .btn{width:auto;flex:1 1 auto;margin:0!important;min-height:44px;padding:var(--sp-2) 14px;font-size:var(--fs-2);border-radius:var(--r-pill)}.qrow .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.qrow .btn.ghost .i{color:var(--prim)}
.hint{color:var(--mut);font-size:var(--fs-s);line-height:1.5;padding:6px 4px 2px}
.dd7{display:flex;justify-content:space-between}.dd{display:grid;justify-items:center;gap:4px}.dd i{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);font-style:normal;font-weight:700;font-size:var(--fs-2)}.dd .ok{background:var(--prim);border-color:var(--prim);color:var(--prim-ink)}.dd .miss{border-color:var(--warn);color:var(--warn)}.dd .late,.dd .part{border-color:var(--mut);color:var(--mut)}.dd small{font-size:var(--fs-cap);color:var(--mut)}

/* Trend */
.seg{display:inline-flex;background:var(--soft);border-radius:var(--r-pill);padding:3px;margin:2px 0 10px}
.seg button{min-height:44px;padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);font-size:var(--fs-2);font-weight:600;color:var(--mut);transition:background var(--dur),color var(--dur)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-1);outline:1px solid var(--card-bd)}
.chart{width:100%;height:auto;display:block}
.srch{display:flex;gap:8px;align-items:center;margin-bottom:8px}.srch .in{flex:1;min-width:0;margin:0}.srch .btn{width:auto;min-height:48px;padding:0 16px}.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--prim);color:var(--prim-ink);font-size:var(--fs-cap);line-height:20px}.chart{touch-action:pan-y}.chart .tip text{fill:var(--ink)}
.legend{display:flex;gap:var(--sp-1) var(--sp-4);font-size:var(--fs-s);color:var(--mut);margin-top:var(--sp-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:var(--sp-3) var(--sp-4);margin-top:var(--sp-2)}
.stat .k{font-size:var(--fs-s);color:var(--mut)}
.stat .v{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.01em}.stat .v small{font-size:var(--fs-s);font-weight:600;color:var(--mut);letter-spacing:0}
table{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
th{font-weight:600;color:var(--mut);text-align:right;padding:var(--sp-1) var(--sp-1) var(--sp-2);font-size:var(--fs-s)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
td.today,th.today{font-weight:700}
.bar{height:8px;border-radius:var(--r-pill);background:var(--soft);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--spor);border-radius:var(--r-pill)}

/* Koç */
#composer{position:fixed;left:var(--sal);right:var(--sar);bottom:calc(68px + var(--nx,0px) + var(--sab));z-index:6;background:var(--bg);padding:6px 12px 8px;max-width:520px;margin:0 auto}
#composer[hidden]{display:none}body.kb nav,body.kb .chiprow{display:none}body.kb #composer{bottom:var(--kb,0px)}body.kb #sheet{bottom:var(--kb,0px);max-height:calc(var(--vh) - 8px);padding-bottom:18px}body.kb #sheet .plist{max-height:none;overflow:visible}
/* Büyük yazıda çipler küçülüp üst üste binmez: içerik genişliğinde kalır, satır yana kayar. */
.chiprow{display:flex;gap:6px;margin-bottom:var(--sp-2);overflow-x:auto;scrollbar-width:none}.chiprow::-webkit-scrollbar{display:none}.chiprow .chip{flex:1 0 auto;min-height:44px;padding:0 var(--sp-2);font-size:var(--fs-s);white-space:nowrap;background:var(--card);box-shadow:var(--sh-1);border:1px solid var(--card-bd)}.chiprow .chip .i{color:var(--mut)}
.cin{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-1);border-radius:var(--r-xl);padding:0 var(--sp-1) 0 var(--sp-4);min-height:52px}.cin:focus-within{border-color:var(--prim)}
.cin input{align-self:stretch;flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
#csend{width:44px;height:44px;border-radius:50%;background:var(--prim);color:var(--prim-ink);font-size:var(--fs-h3)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:5;pointer-events:none}body.koc main{padding-bottom:var(--cmp,calc(200px + var(--sab)))}.chips.cbar{position:sticky;top:var(--sat);z-index:4;background:var(--bg);padding:6px 0;margin:-6px 0 0}
body.koc{--toast-b:var(--cmp,calc(200px + var(--sab)))}
.chat{display:flex;flex-direction:column;gap:12px}
.ub{align-self:flex-end;max-width:84%;background:var(--prim);color:var(--prim-ink);border-radius:var(--r) var(--r) var(--r-xs) var(--r);padding:10px 14px;overflow-wrap:anywhere;white-space:pre-wrap}
.pendl{align-self:flex-end;margin-top:-8px;font-size:var(--fs-s);color:var(--mut)}
.cm{align-self:flex-start;max-width:92%;background:var(--card);border:1px solid var(--card-bd);box-shadow:var(--sh-1);border-radius:var(--r) var(--r) var(--r) var(--r-xs);padding:10px 14px;min-width:0}.cm p{margin:0;font-size:var(--fs-1);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.dots{letter-spacing:3px;color:var(--mut)}
.banner{background:var(--ban-bg);border:1px solid var(--ban-bd);color:var(--ban-ink);border-radius:var(--r);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3)}
.banner.info{background:var(--inf-bg);border-color:var(--inf-bd);color:var(--inf-ink)}
.banner p{margin:var(--sp-1) 0 var(--sp-3);font-size:var(--fs-2);line-height:1.45}.banner p:only-child,.banner p:last-child{margin-bottom:0}.banner .btn{width:auto;padding:var(--sp-3) 18px}
.scard{background:var(--inf-bg);border:1px solid var(--inf-bd);color:var(--ink);border-radius:var(--r);padding:var(--sp-3) var(--sp-4);margin-top:var(--sp-2)}
.scard b{font-size:var(--fs-h3)}.scard p{margin:var(--sp-2) 0 var(--sp-3);font-size:var(--fs-2);line-height:1.5}
.srow2{display:flex;gap:8px;margin-bottom:8px}.sbtn{flex:1;min-height:48px;border-radius:var(--r-s);background:var(--info);color:var(--info-ink);font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none}
.sbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--inf-bd)}
.lcard{margin:8px 0 0}.lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.chip:disabled{opacity:.5;cursor:default}
.tahmin{font-size:var(--fs-cap);font-weight:600;color:var(--tah-ink);background:var(--tah-bg);border-radius:var(--r-pill);padding:3px 10px}
.lrow{justify-content:space-between}
.kin{width:72px;min-height:44px;text-align:right;border:1px solid var(--mut);border-radius:var(--r-xs);background:var(--field);padding:0 8px}
.lbtns{display:flex;gap:8px;margin-top:10px}.lbtns .btn{padding:12px}
.chkrow{justify-content:space-between;font-size:var(--fs-2)}.chkrow .nm{flex:1;min-width:0}.chkrow small{display:block;color:var(--mut);font-size:var(--fs-s)}
/* Salon */

function cleanMyFoods(arr){

    const n=x.n.trim().slice(0,60),key=tr(n);if(seen.has(key))continue;seen.add(key);

/* Dokunma/sürükleme: en yakın noktanın değeri balonda. data-tip: [[x,y,metin]...] (viewBox birimi). */
function chartTip(svg,cx){
  const P=JSON.parse(svg.dataset.tip),[,,W]=svg.getAttribute("viewBox").split(" ").map(Number),r=svg.getBoundingClientRect(),x=(cx-r.left)*W/(r.width||W);
  const b=P.reduce((m,p)=>Math.abs(p[0]-x)<Math.abs(m[0]-x)?p:m);
  const w=b[2].length*6.6+14,bx=Math.min(Math.max(b[0]-w/2,2),W-w-2),by=b[1]>40?b[1]-34:b[1]+10;
  svg.querySelector(".tip")?.remove();
  svg.insertAdjacentHTML("beforeend",`<g class="tip" pointer-events="none"><circle cx="${b[0]}" cy="${b[1]}" r="5" fill="none" stroke="var(--ink)" stroke-width="2"/><rect x="${bx.toFixed(1)}" y="${by}" width="${w.toFixed(1)}" height="24" rx="6" fill="var(--card)" stroke="var(--mut)"/><text x="${(bx+7).toFixed(1)}" y="${by+16}">${esc(b[2])}</text></g>`);
}
for(const t of ["pointerdown","pointermove"])document.addEventListener(t,ev=>{
  const s=ev.target.closest&&ev.target.closest("svg[data-tip]");
  if(s&&(t==="pointerdown"||ev.buttons||ev.pointerType==="mouse"))chartTip(s,ev.clientX);
  else if(t==="pointerdown")document.querySelectorAll(".tip").forEach(n=>n.remove());
});

/* Onay penceresi (tarayıcının yerel onay kutusu yerine): Promise<boolean>, odak İptal'de, Escape ve geri tuşu iptal eder.
   Testte window.__confirmAuto ya da yerel olmayan bir window.confirm saplaması varsa pencere açılmaz; yanıt eşzamanlı verilir
   (.then geri çağrısı aynı adımda çalışır) ve saplamaya eski tam metin gider. */
let cfmDone=null;
function confirmSheet({title,body="",ok="Tamam",no="İptal",danger=false}){
  const msg=body||title,c=window.confirm;
  const auto=window.__confirmAuto||(typeof c==="function"&&!/\[native code\]/.test(Function.prototype.toString.call(c))&&c);
  if(auto){const v=!!auto(msg);return {then:f=>Promise.resolve(f?f(v):v)}}
  if(cfmDone)cfmDone(false);
  const d=$("#cfm"),from=document.activeElement;
  $("#cfmt").textContent=title;$("#cfmb").textContent=body;$("#cfmb").hidden=!body;
  const y=d.querySelector('[data-cf="1"]'),n=d.querySelector('[data-cf="0"]');
  y.textContent=ok;y.className=danger?"btn danger":"btn";n.textContent=no;
  d.hidden=false;trap();n.focus();
  return new Promise(res=>{cfmDone=v=>{cfmDone=null;d.hidden=true;trap();if(from&&from.isConnected)from.focus({preventScroll:true});res(v)}});

    else if(d.act==="adimduz"){if(oemXiaomi())sheetOem();else openDH("openBattery")}
    else if(d.act==="adimgizle"){S.settings.stepWarnDay=dayKey();save();render()}
    else if(d.act==="oemok"){S.settings.oemDone=true;save();closeSheet();render();toast("Tamam, hatırlatmaları şimdi dene")}
    else if(d.act==="profil"){tab="ayar-profil";render();window.scrollTo(0,0)}
    else if(d.act==="saglik")openSheet(`<h3>Sağlık notların</h3><div class="lbl">Hamilelik, hastalık, ilaç, yeme bozukluğu geçmişi gibi koçun bilmesi gerekenler.</div><textarea class="in" id="hn" maxlength="500" autofocus>${esc(S.settings.healthNote)}</textarea><button class="btn" data-go="saglik">Kaydet</button>`);
    else if(d.act==="riskok"){S.settings.riskClearedAt=dayKey();save();render();toast("Onaylandı, 30 gün geçerli")}
    else if(d.act.startsWith("uygula:")){S.settings.kcal=+d.act.slice(7);save();render();toast(`Kalori hedefi ${S.settings.kcal} kcal oldu`)}
    else if(d.act==="sifirla")confirmSheet({title:"Tüm veriler silinsin mi?",body:"Tüm kayıtlar, güvenlik kopyası ve kayıtlı Koç anahtarları silinecek. Bu geri alınamaz. Devam edilsin mi?",ok:"Hepsini sil",danger:true}).then(ok=>{if(ok){["koc_v1","koc_v1_onceki","koc_v1_bozuk","koc_v1_kullanim",KEYS_LS,KEYS_ENC].forEach(lsDel);KEYS={};S=structuredClone(DEF);phClear();save();logOff=0;render();scheduleReminders().then(setNotif);toast("Tüm veriler silindi")}})
    return;
  }
  if(d.go){
    ({kilo:goKilo,yemek:goYemek,besin:goBesin,mysil:goMySil,tpl:goTpl,adim:goAdim,spor:goSpor,not:goNot,yukle:goYukle,saglik:()=>{S.settings.healthNote=$("#hn").value.trim().slice(0,500);cNoteCheck();save();closeSheet();render();toast("Kaydedildi")}}[d.go]||(()=>{}))();
    if(d.go==="kopyala")backupText().then(v=>{if(!v)return;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast("Panoya kopyalandı"),()=>{const b=$("#bk");b.value=v;b.select();document.execCommand&&document.execCommand("copy");toast("Metni seçtim, kopyala")})});
    if(d.go==="paylas")shareBackup();
    if(d.go==="indir")backupText().then(v=>{if(!v)return;try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([v],{type:"application/json"}));a.download=`neowell-yedek-${dayKey()}.json`;a.click();markBackup()}catch(e){toast("İndirme bu cihazda çalışmadı, Kopyala'yı kullan")}});
  }
});

document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="bkfile"){
    const f=t.files&&t.files[0];if(!f)return;
    if(f.size>5e6)return toast("Dosya çok büyük, bir NeoWell yedeği olmayabilir");
    f.text().then(x=>{$("#bk").value=x;toast("Dosya okundu. Devam etmek için geri yükle'ye dokun")},()=>toast("Dosya okunamadı"));
    return;
  }
  if(t.dataset.gi){gInput(t);return}
  if(t.dataset.mk!==undefined){S.settings.moveKcalOn=t.checked;save();return}
  if(t.dataset.rpe!==undefined){S.settings.rpeOn=t.checked;save();return}
  if(t.dataset.gdv!==undefined){S.settings.gdVoice=t.checked;save();return}
  if(t.dataset.gdb!==undefined){S.settings.gdVib=t.checked;save();return}
  if(t.dataset.aw!==undefined){S.settings.awakeOn=t.checked;save();gAwake();return}
  if(t.dataset.set){
    const k=t.dataset.set,st=S.settings,[lo,hi,int]=RANGES[k],raw=t.value.trim();
    const wk=k==="goalKg",show=x=>x?(wk?dw(x).replace(/,0$/,""):String(x).replace(".",",")):"";
    if(raw===""&&ZEROOK.includes(k)){st[k]=0;save();t.value="";toast(`${SETLBL[k]} kapatıldı`);return}
    const v=wk?Units.wIn(num(raw)):num(raw,int);
    if(isNaN(v)||v<lo||v>hi){t.value=show(st[k]);toast(wk&&wlab()==="lb"?`${SETLBL[k]} ${dw(lo,0)} ile ${dw(hi,0)} ${wlab()} arasında olmalı`:`${SETLBL[k]} ${String(lo).replace(".",",")} ile ${String(hi).replace(".",",")} arasında${int?" tam sayı":""} olmalı`);return}
    const why=k==="kcal"?kcalWhy(v):"";
    if(why){t.value=show(st[k]);toast(why);return}
    st[k]=v;if(k==="age")cAgeGuard();save();t.value=show(v);return;
  }
  if(t.dataset.rt||t.dataset.ro){
    const r=S.settings.reminders.find(x=>x.id===+(t.dataset.rt||t.dataset.ro));
    if(t.dataset.rt)r.t=t.value||r.t;else r.on=t.checked;
    save();scheduleReminders().then(setNotif);
  }
});

function backKey(){
  if(cfmDone){cfmDone(false);return true}
  if(gdBack())return true;
  if($("#sheet").classList.contains("on")){closeSheet();return true}
  if(obNeeded()&&ob.step){ob.step--;render();return true}

}

/* Koç sohbetinin alt boşluğu yazma alanının gerçek yüksekliğinden gelir: son mesaj alanın arkasında kalmaz (klavye, yatay ekran, büyük yazı tipi). */
function cmpSet(){const c=$("#composer");if(c.hidden)return;document.documentElement.style.setProperty("--cmp",Math.ceil(innerHeight-c.getBoundingClientRect().top)+12+"px")}
if(window.ResizeObserver)new ResizeObserver(cmpSet).observe($("#composer"));
addEventListener("resize",cmpSet);
/* Klavye: ekran küçülse de küçülmese de (kenardan kenara) alt çubuk gizlenir, sabit alanlar --kb kadar yükselir, odaktaki alan görünür kalır. */
{const vv=window.visualViewport;let base=0,lw=innerWidth;
  const kb=()=>{if(!vv)return;const h=vv.height;if(innerWidth!==lw){lw=innerWidth;base=0}base=Math.max(base,innerHeight,h);const open=base-h>120,b=Math.max(0,innerHeight-h-vv.offsetTop),d=document.documentElement.style;
    document.body.classList.toggle("kb",open);d.setProperty("--kb",open?b+"px":"0px");d.setProperty("--vh",h+"px");cmpSet()};
  if(vv){kb();vv.addEventListener("resize",kb);vv.addEventListener("scroll",kb);addEventListener("orientationchange",()=>{base=0;kb()})}
  document.addEventListener("focusin",e=>{if(e.target.matches("input,textarea,select"))setTimeout(()=>e.target.scrollIntoView({block:"center"}),250)});
}
