<script>
/* The main script runs after the store (IndexedDB) has been read: S and load() stay synchronous, and an early save cannot overwrite real data with defaults. */
(function(){
  const parts=[...document.querySelectorAll('script[type="text/x-main"]')];
  const text=e=>e.textContent||fetch(e.dataset.src).then(r=>{if(!r.ok)throw 0;return r.text()});
  const go=t=>{const s=document.createElement("script");s.textContent=t.join("");document.body.appendChild(s);document.documentElement.dataset.boot=1;document.dispatchEvent(new Event("nw:boot"))}; // nw:boot: S and render are ready; used instead of DOMContentLoaded
  const run=()=>{const t=parts.map(text);t.some(x=>x&&x.then)?Promise.all(t).then(go):go(t)}; // parts embedded in the page (tests) run synchronously
  const p=Store.init();
  if(p&&p.then)p.then(run);else run();
})();
</script>
