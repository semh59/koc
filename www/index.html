/* Ana betik, depo (IndexedDB) okunduktan sonra çalışır: S ve load() eşzamanlı kalır, erken kayıt varsayılanla gerçek veriyi ezemez. */
(function(){
  const parts=[...document.querySelectorAll('script[type="text/x-main"]')];
  const text=e=>e.textContent||fetch(e.dataset.src).then(r=>{if(!r.ok)throw 0;return r.text()});
  const go=t=>{const s=document.createElement("script");s.textContent=t.join("");document.body.appendChild(s);document.documentElement.dataset.boot=1;document.dispatchEvent(new Event("nw:boot"))}; // nw:boot: S ve render hazır, DOMContentLoaded yerine
  const run=()=>{const t=parts.map(text);t.some(x=>x&&x.then)?Promise.all(t).then(go):go(t)}; // parçalar gömülüyse (testler) eşzamanlı
  const p=Store.init();
  if(p&&p.then)p.then(run);else run();
})();
</script>
