version: 2
updates:
  # Action versions are pinned to a full SHA; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  # npm packages (Capacitor and tools): monthly PR for security and version updates.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
