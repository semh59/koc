version: 2
updates:
  # Eylem sürümleri tam SHA'ya sabit; Dependabot SHA ve sürüm yorumunu birlikte günceller.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  # npm paketleri (Capacitor ve araçlar): güvenlik ve sürüm güncellemeleri için aylık PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
