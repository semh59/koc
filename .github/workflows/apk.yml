name: APK derle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Certificate fingerprint of the release (Play upload) key; if the secret is replaced with another key, CI stops.
  RELEASE_SHA256: 89a6ed7d72f27525fc74a3523f99868e890b5a3f0c70de2a845ea54262f143ee

# Nothing is cancelled on main so the release step is never cut short; a manual run on another branch is cancelled by a newer one.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Native logic tests
        run: |
          javac -d /tmp/stepmath assets/android/StepMath.java assets/android/QuickMath.java assets/android/MotionMath.java assets/android/LockText.java scripts/StepMathTest.java scripts/QuickMathTest.java scripts/MotionMathTest.java scripts/LockTextTest.java
          java -cp /tmp/stepmath com.neowell.app.StepMathTest
          java -cp /tmp/stepmath com.neowell.app.QuickMathTest
          java -cp /tmp/stepmath com.neowell.app.MotionMathTest
          java -cp /tmp/stepmath com.neowell.app.LockTextTest

      - name: Generate the Android project
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
          npm run android:sync:verify

      - name: Android instrumentation test contract
        run: |
          grep -q 'assertEquals("com.neowell.app"' android/app/src/androidTest/java/com/getcapacitor/myapp/ExampleInstrumentedTest.java
          grep -q 'applicationId "com.neowell.app"' android/app/build.gradle

      - name: Decode the release key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          # Never fall back to the debug signature: the published APK would be signed with a publicly known key.
          [ -n "$RELEASE_KEYSTORE_B64" ] || { echo "RELEASE_KEYSTORE_B64 secret is missing, the release cannot be signed"; exit 1; }
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease --no-daemon

      - name: Collect the files
        run: |
          mkdir -p smoke
          cp android/app/build/outputs/apk/debug/app-debug.apk smoke/neowell.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk smoke/neowell-test.apk
          cp android/app/build/outputs/apk/release/app-release.apk neowell.apk
          cp android/app/build/outputs/bundle/release/app-release.aab neowell.aab
          sha256sum neowell.apk neowell.aab > build-artifact-sha256.txt

      - name: Release signature is the expected key
        run: |
          norm() { tr -d ': ' | tr 'A-F' 'a-f'; }
          bt=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          apksigner=${bt}apksigner
          ${bt}aapt2 dump badging neowell.apk > badging0.txt || { echo "aapt2 failed"; exit 1; }
          min=$(grep -oE "minSdkVersion:'[0-9]+'" badging0.txt | grep -oE "[0-9]+" | head -1 || true)
          echo "minSdk=${min:-unreadable}"; [ -n "$min" ] || { echo "minSdk unreadable; start of badging:"; head -5 badging0.txt; exit 1; }
          # Error output is not suppressed: if the signature is broken the log shows why.
          $apksigner verify --verbose --print-certs --min-sdk-version "$min" neowell.apk | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt || { echo "APK SIGNATURE NOT VERIFIED WITH THE V2 SCHEME"; exit 1; }
          grep -E "Verified using v1" verify.txt
          apk=$(grep -m1 "certificate SHA-256 digest" verify.txt | sed 's/.*: //' | norm)
          aab=$(keytool -printcert -jarfile neowell.aab | grep -m1 "SHA256:" | sed 's/.*SHA256: //' | norm)
          dbg=$(keytool -list -keystore signing/known-debug-smoke-only.keystore -storepass android | grep -i "SHA-256" | sed 's/.*: //' | norm)
          echo "APK: $apk"; echo "AAB: $aab"; echo "Expected: $RELEASE_SHA256"; echo "Debug: $dbg"
          [ -n "$dbg" ] && [ "$apk" != "$dbg" ] && [ "$aab" != "$dbg" ] || { echo "PUBLISHED FILE IS SIGNED WITH THE DEBUG KEY"; exit 1; }
          [ "$apk" = "$RELEASE_SHA256" ] && [ "$aab" = "$RELEASE_SHA256" ] || { echo "RELEASE SIGNING KEY MISMATCH"; exit 1; }

      - name: APK content audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          aapt2=${bt}aapt2
          $aapt2 dump xmltree neowell.apk --file AndroidManifest.xml > manifest.txt
          grep -E "allowBackup|dataExtractionRules|fullBackupContent|usesCleartextTraffic" manifest.txt
          if grep -q "debuggable" manifest.txt; then echo "RELEASE APK DEBUGGABLE"; exit 1; fi
          grep -qE "allowBackup[^=]*=(false|0x0)" manifest.txt || { echo "AUTOMATIC BACKUP ENABLED"; exit 1; }
          if grep "usesCleartextTraffic" manifest.txt | grep -qE "=true|0xffffffff"; then echo "CLEARTEXT (HTTP) TRAFFIC ENABLED"; exit 1; fi
          grep -oE "android\.permission\.[A-Z_]+" manifest.txt | sort -u | tee apk-perms.txt
          if grep -qE "USE_EXACT_ALARM|FLASHLIGHT|ACCESS_BACKGROUND_LOCATION" manifest.txt; then echo "PERMISSION NOT ALLOWED BY PLAY"; exit 1; fi
          grep -q "android.permission.FOREGROUND_SERVICE_LOCATION" manifest.txt || { echo "LOCATION SERVICE PERMISSION MISSING"; exit 1; }
          grep -q "android.permission.USE_BIOMETRIC" manifest.txt || { echo "USE_BIOMETRIC PERMISSION MISSING (the app lock would crash)"; exit 1; }
          # Exported components: only MainActivity and the widget (the system sends APPWIDGET_UPDATE), the androidx profileinstaller receiver (protected by a permission),
          # and the Health Connect permission-usage alias (bound to START_VIEW_PERMISSION_USAGE, which only the system can hold).
          awk '/^ *E: (activity|activity-alias|receiver|service|provider)( |$)/ {if (n != "" && e) print n; n=""; e=0; c=1; next} /^ *E: / {c=0} c && /android:name\(/ {match($0, /="[^"]*"/); n=substr($0, RSTART+2, RLENGTH-3)} c && /android:exported\(/ && (/=true/ || /0xffffffff/) {e=1} END {if (n != "" && e) print n}' manifest.txt | sort -u > exported.txt
          echo "Exported components:"; cat exported.txt
          bad=$(grep -vE '(^|\.)(MainActivity|NeoWidget|HealthPermissionUsage)$|^androidx\.profileinstaller\.ProfileInstallReceiver$' exported.txt || true)
          [ -z "$bad" ] || { echo "UNEXPECTED EXPORTED COMPONENT (only MainActivity and NeoWidget may be exported):"; echo "$bad"; exit 1; }
          grep -qE "(^|\.)MainActivity$" exported.txt && grep -qE "(^|\.)NeoWidget$" exported.txt || { echo "MainActivity or NeoWidget does not look exported, the audit parser may be broken"; exit 1; }
          $aapt2 dump badging neowell.apk > badging.txt
          min=$(grep -oE "minSdkVersion:'[0-9]+'" badging.txt | grep -oE "[0-9]+" | head -1 || true)
          vc=$(grep -oE "versionCode='[0-9]+'" badging.txt | grep -oE "[0-9]+")
          echo "minSdk=$min versionCode=$vc"
          [ "$min" -ge 24 ] && [ "$min" -le 26 ] || { echo "minSdk outside the expected range (24-26): $min"; exit 1; }
          [ "$vc" = "$GITHUB_RUN_NUMBER" ] || { echo "versionCode differs from the run number ($vc, $GITHUB_RUN_NUMBER)"; exit 1; }
          mkdir -p prev
          # No release at all (404) means this is the first publication and the comparison is skipped; a network or API error is not skipped: 3 tries, then the build stops.
          state=""
          for t in 1 2 3; do
            if err=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/son-surum" --jq .tag_name 2>&1); then state=exists; break; fi
            case "$err" in *"HTTP 404"*) state=none; break;; esac
            echo "Release query failed ($t/3): $err"; sleep $((t * 10))
          done
          [ -n "$state" ] || { echo "PREVIOUS RELEASE COULD NOT BE QUERIED (network or API error): the versionCode comparison cannot be skipped"; exit 1; }
          if [ "$state" = exists ]; then
            got=""
            for t in 1 2 3; do
              if gh release download son-surum -p neowell.apk -D prev --clobber; then got=1; break; fi
              echo "Previous APK download failed ($t/3)"; sleep $((t * 10))
            done
            [ -n "$got" ] || { echo "PREVIOUS VERSION COULD NOT BE DOWNLOADED: the versionCode comparison cannot be skipped"; exit 1; }
            pvc=$($aapt2 dump badging prev/neowell.apk | grep -oE "versionCode='[0-9]+'" | grep -oE "[0-9]+")
            echo "Previous versionCode: $pvc"
            [ "$vc" -gt "$pvc" ] || { echo "versionCode not greater than the previous one ($vc <= $pvc): Play rejects the upload"; exit 1; }
          else
            echo "No previous release (first publication): versionCode comparison skipped"
          fi
          ls -l neowell.apk
          unzip -lv neowell.apk | awk 'NR>3 && length($7)==8 && $7 ~ /^[0-9a-f]+$/ {split($8,p,"/"); k=(p[1]=="lib"||p[1]=="assets")?p[1]"/"p[2]:p[1]; s[k]+=$3} END {for (k in s) printf "%8.2f MB  %s\n", s[k]/1e6, k}' | sort -rn | head -12
          unzip -l neowell.apk > apk-list.txt
          if grep -qE "lib/x86/|libbarhopper" apk-list.txt; then echo "APK SHRINKING NOT APPLIED"; exit 1; fi

      - name: AAB content audit
        run: |
          unzip -l neowell.aab > aab-list.txt
          if grep -qE "base/lib/x86/|libbarhopper" aab-list.txt; then echo "AAB SHRINKING NOT APPLIED (lib/x86 or libbarhopper present)"; exit 1; fi
          grep -q "base/lib/arm64-v8a/" aab-list.txt || { echo "AAB HAS NO arm64-v8a LIBRARY"; exit 1; }
          # The AAB manifest is protobuf; permission names are readable as plain text. The set must equal the APK's.
          unzip -p neowell.aab base/manifest/AndroidManifest.xml | grep -aoE "android\.permission\.[A-Z_]+" | sort -u > aab-perms.txt
          echo "AAB permissions:"; cat aab-perms.txt
          if grep -qE "USE_EXACT_ALARM|FLASHLIGHT|ACCESS_BACKGROUND_LOCATION" aab-perms.txt; then echo "AAB HAS A PERMISSION NOT ALLOWED BY PLAY"; exit 1; fi
          diff apk-perms.txt aab-perms.txt || { echo "APK AND AAB PERMISSION LISTS DIFFER (above: - APK, + AAB)"; exit 1; }

      - name: Target API 36 and 16 KB page alignment
        run: |
          # For 16 KB-page devices Play requires both the alignment inside the ZIP (uncompressed .so files) and the 2^14 alignment of every LOAD segment.
          # All checks run and print a summary first, then the step fails with the reasons.
          bt=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          fail=""
          for f in neowell.apk smoke/neowell.apk; do
            ${bt}aapt2 dump badging $f | grep -q "targetSdkVersion:'36'" || fail="$fail\n$f: target API is not 36"
            if ! ${bt}zipalign -c -P 16 -v 4 $f > zipalign.txt; then
              grep -v "(OK" zipalign.txt | tail -20
              fail="$fail\n$f: zipalign -P 16 failed (.so files inside the ZIP are not aligned to 16 KB)"
            fi
          done
          so=$RUNNER_TEMP/so
          mkdir -p $so/apk $so/aab
          unzip -qo neowell.apk 'lib/arm64-v8a/*' 'lib/x86_64/*' -d $so/apk
          unzip -qo neowell.aab 'base/lib/arm64-v8a/*' 'base/lib/x86_64/*' -d $so/aab
          printf "%-5s %-55s %s\n" SOURCE LIBRARY LOAD-ALIGNMENTS
          for src in apk aab; do
            for f in $(find $so/$src -name '*.so' | sort); do
              a=$(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
              printf "%-5s %-55s %s\n" $src ${f#$so/$src/} "$a"
              for x in $a; do [ $((x)) -ge 16384 ] || { fail="$fail\n$src ${f#$so/$src/}: LOAD alignment $x < 16384"; break; }; done
            done
          done
          [ -z "$fail" ] || { echo "---- 16 KB / TARGET API CHECK FAILED ----"; printf "$fail\n"; exit 1; }
          echo "16 KB alignment and target API 36 OK"

      # Files travel between jobs through the Actions cache: the release must not stop when the artifact storage quota is full.
      - name: Prepare the files for the next jobs
        run: |
          mkdir -p handoff/release
          cp neowell.apk neowell.aab handoff/release/
          cp smoke/neowell.apk handoff/smoke.apk
          cp smoke/neowell-test.apk handoff/smoke-test.apk
          sha256sum neowell.apk neowell.aab > handoff/release/build-artifact-sha256.txt
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: handoff
          key: nw-${{ github.run_id }}-${{ github.run_attempt }}

  # End-to-end user scenarios in the browser (e2e/). Independent of the build; the release job waits for it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e-report/
            test-results/
          retention-days: 14

  # Runs on every push to main (emulator ~8 min).
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: handoff
          key: nw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nw-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Place the files
        run: |
          cp handoff/smoke.apk neowell.apk
          cp handoff/smoke-test.apk neowell-test.apk
          cp -r handoff/release release
          (cd release && sha256sum -c build-artifact-sha256.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open and check in the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            adb install -r neowell.apk
            adb install -r neowell-test.apk
            adb shell am instrument -w -r com.neowell.app.test/androidx.test.runner.AndroidJUnitRunner
            bash scripts/smoke.sh
            bash scripts/smoke-release.sh

  # Same smoke on Android 12 (API 31, the last Android of Galaxy M51): not a release gate, it only shows a crash that API 36 hides.
  smoke-android12:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: handoff
          key: nw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nw-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Place the files
        run: |
          cp handoff/smoke.apk neowell.apk
          cp handoff/smoke-test.apk neowell-test.apk
          cp -r handoff/release release
          (cd release && sha256sum -c build-artifact-sha256.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open and check in the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          script: |
            adb install -r neowell.apk
            adb install -r neowell-test.apk
            adb shell am instrument -w -r com.neowell.app.test/androidx.test.runner.AndroidJUnitRunner
            bash scripts/smoke.sh
            bash scripts/smoke-release.sh

  # Only after build, e2e and smoke pass. The new files are uploaded first (--clobber replaces a file of the same name) and the old release is never deleted:
  # even if the job is cut short, a downloadable version remains.
  release:
    needs: [build, e2e, smoke, smoke-android12]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: handoff
          key: nw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nw-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Place the files
        run: cp -r handoff/release release
      - name: Upload to the Releases page (easy download from the phone)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # GitHub keeps the date of the first publication; the title and the notes show the current version and build time. The notes are read on the phone, so they stay Turkish.
          title="NeoWell 1.0.${{ github.run_number }} ($(date -u +'%d.%m.%Y %H:%M') UTC)"
          notes="Sürüm 1.0.${{ github.run_number }}, derleme $(date -u +'%d.%m.%Y %H:%M') UTC, commit ${GITHUB_SHA::7}. Telefondan neowell.apk dosyasını indirip kur. neowell.aab Play Console yüklemesi içindir."
          publish() {
            if gh release view son-surum > /dev/null 2>&1; then
              gh release upload son-surum release/neowell.apk release/neowell.aab --clobber &&
              gh release edit son-surum --title "$title" --notes "$notes" &&
              # The tag must point at the commit of the new build.
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/son-surum" -f sha="$GITHUB_SHA" -F force=true
            else
              gh release create son-surum release/neowell.apk release/neowell.aab --title "$title" --notes "$notes" --target "$GITHUB_SHA"
            fi
          }
          # A temporary 403/5xx from the network or API must not waste the build: 3 attempts.
          for i in 1 2 3; do publish && exit 0; echo "upload attempt $i failed"; sleep 15; done
          exit 1
