name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testleri çalıştır
        run: npm test

      - name: Adım sayacı mantığı testi
        run: |
          javac -d /tmp/stepmath assets/android/StepMath.java assets/android/QuickMath.java assets/android/MotionMath.java scripts/StepMathTest.java scripts/QuickMathTest.java scripts/MotionMathTest.java
          java -cp /tmp/stepmath com.neowell.app.StepMathTest
          java -cp /tmp/stepmath com.neowell.app.QuickMathTest
          java -cp /tmp/stepmath com.neowell.app.MotionMathTest

      - name: Android projesini oluştur
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Sabit imza anahtarını yerleştir
        run: |
          mkdir -p ~/.android
          cp signing/koc-debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını hazırla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk neowell.apk

      - name: APK sabit imza anahtarıyla imzalandı mı
        run: |
          apk=$(unzip -p neowell.apk 'META-INF/*.RSA' | openssl pkcs7 -inform DER -print_certs | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2)
          key=$(keytool -list -keystore signing/koc-debug.keystore -storepass android | grep -i "SHA-256" | sed 's/.*: //')
          echo "APK: $apk"; echo "Anahtar: $key"
          [ -n "$apk" ] && [ "$apk" = "$key" ] || { echo "İMZA ANAHTARI UYUŞMUYOR"; exit 1; }

      - name: APK içeriği denetimi
        run: |
          aapt2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          $aapt2 dump xmltree neowell.apk --file AndroidManifest.xml > manifest.txt
          grep -E "allowBackup|dataExtractionRules|fullBackupContent" manifest.txt
          grep -qE "allowBackup[^=]*=(false|0x0)" manifest.txt || { echo "OTOMATİK YEDEK AÇIK"; exit 1; }
          grep -oE "android\.permission\.[A-Z_]+" manifest.txt | sort -u
          if grep -qE "USE_EXACT_ALARM|FLASHLIGHT" manifest.txt; then echo "PLAY'E UYGUN OLMAYAN İZİN VAR"; exit 1; fi
          ls -l neowell.apk
          unzip -lv neowell.apk | awk 'NR>3 && length($7)==8 && $7 ~ /^[0-9a-f]+$/ {split($8,p,"/"); k=(p[1]=="lib"||p[1]=="assets")?p[1]"/"p[2]:p[1]; s[k]+=$3} END {for (k in s) printf "%8.2f MB  %s\n", s[k]/1e6, k}' | sort -rn | head -12
          unzip -l neowell.apk > apk-list.txt
          if grep -qE "lib/x86/|libbarhopper" apk-list.txt; then echo "APK KÜÇÜLTMESİ UYGULANMADI"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: neowell-apk
          path: neowell.apk

      - name: Releases sayfasına yükle (telefondan kolay indirme)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum neowell.apk --title "NeoWell APK (son sürüm)" --notes "Telefondan bu sayfadaki neowell.apk dosyasını indirip kur."

  smoke:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neowell-apk
      - name: KVM iznini aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde aç ve kontrol et
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          emulator-build: 11237101
          arch: x86_64
          script: bash scripts/smoke.sh
