name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Android projesini oluştur
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Sabit imza anahtarını yerleştir
        run: |
          mkdir -p ~/.android
          cp signing/koc-debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını hazırla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk koc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: koc-apk
          path: koc.apk

      - name: Releases sayfasına yükle (telefondan kolay indirme)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum koc.apk --title "Koç APK (son sürüm)" --notes "Telefondan bu sayfadaki koc.apk dosyasını indirip kur."
